async function ensureDocx() {
  if (!window.docx) await loadScript('lib/docx.iife.js');
  return window.docx;
}

async function exportWord(kind) {
  if (!state.blocks.length) { toast('問題エディタが空です', 'warn'); return; }
  const busy = h('div', { class: 'busy-full' }, h('div', { class: 'spinner' }), h('span', null, 'Wordファイルを作成中…'));
  document.body.appendChild(busy);
  try {
    const D = await ensureDocx();
    const doc = buildDocx(D, kind);
    const blob = await D.Packer.toBlob(doc);
    const S = state.settings;
    const suffix = { exam: '問題', answers: '解答解説', sheet: '解答用紙' }[kind];
    await saveFile(safeFileName(`${S.title}_${S.subject}_${suffix}`) + '.docx', blob);
  } catch (e) {
    console.error(e);
    toast('Wordファイルを作れませんでした：' + (e && e.message ? e.message : e), 'err', 7000);
  } finally {
    busy.remove();
  }
}

function charUnits(s) {
  let n = 0;
  for (const c of String(s)) n += /[\x20-\x7e]/.test(c) ? 0.5 : 1;
  return n;
}

// 末尾の改行・空白を取り除く（Wordで空の段落にならないように）
function trimRuns(runs) {
  const out = (runs || []).map((r) => (r.t === 's' ? { ...r } : r));
  while (out.length && out[out.length - 1].t === 's') {
    const v = out[out.length - 1].v.replace(/[\s\n]+$/, '');
    if (v) { out[out.length - 1].v = v; break; }
    out.pop();
  }
  return out;
}

function splitRunLines(runs) {
  const lines = [[]];
  for (const r of trimRuns(runs)) {
    if (r.t !== 's') { lines[lines.length - 1].push(r); continue; }
    const parts = r.v.split('\n');
    parts.forEach((p, i) => {
      if (i > 0) lines.push([]);
      if (p) lines[lines.length - 1].push({ t: 's', v: p });
    });
  }
  return lines;
}

function buildDocx(D, kind) {
  const {
    Document, Paragraph, TextRun, ImageRun, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType,
    PageBreak, TabStopType, UnderlineType, VerticalAlign, TableLayoutType, Footer, PageNumber, SectionType,
    PageOrientation, HeightRule, ShadingType, Tab, LineRuleType,
  } = D;
  const S = state.settings;
  const P = PAPERS[S.paper] || PAPERS.A4P;
  const num = computeNumbering();
  const sz = Math.round(S.fontSize * 2);
  const CH = Math.round(S.fontSize * 20); // 全角1文字（twips）
  const FONT = { ascii: S.font, eastAsia: S.font, hAnsi: S.font, cs: S.font };
  const colW = P.colW;
  const fullW = P.contentW;
  const KP = P.land ? PAPERS.A4P : P; // 解答・解説は横長なら A4縦 に

  const pageH = (P.land ? P.w : P.h) - P.margin * 2;

  const T = (text, o = {}) => new TextRun({ text, ...o });
  const NB = { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' };
  const noBorders = { top: NB, bottom: NB, left: NB, right: NB };
  const line = (size = 6, color = '000000') => ({ style: BorderStyle.SINGLE, size, color });
  const allBorders = (size = 6, color = '000000') => ({ top: line(size, color), bottom: line(size, color), left: line(size, color), right: line(size, color) });
  const tableNoBorders = { ...noBorders, insideHorizontal: NB, insideVertical: NB };
  const spacer = (after = 80) => new Paragraph({ spacing: { before: 0, after }, children: [] });

  function runsToTR(runs, base = {}) {
    const out = [];
    for (const r of trimRuns(runs)) {
      if (r.t === 's') {
        r.v.split('\n').forEach((p, i) => {
          if (i > 0) out.push(new TextRun({ break: 1, ...base }));
          if (p) out.push(T(p, base));
        });
      } else if (r.t === 'b') {
        const info = num.marks.get(r.id);
        out.push(T(info ? info.text : `（${r.ans}）`, base));
      } else if (r.t === 'u') {
        const info = num.marks.get(r.id);
        if (info) out.push(T(info.text, { ...base, superScript: true }));
        out.push(T(r.v, { ...base, underline: { type: UnderlineType.SINGLE } }));
      }
    }
    return out;
  }

  function nameLine(alignRight = true) {
    return new Paragraph({
      alignment: alignRight ? AlignmentType.RIGHT : AlignmentType.LEFT,
      spacing: { before: 120, after: 160 },
      children: [T('（　　）年（　　）組（　　）番　氏名'), T('　'.repeat(14), { underline: { type: UnderlineType.SINGLE } })],
    });
  }

  function headerBlock(title) {
    const out = [];
    out.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 40 }, children: [T(title, { bold: true, size: sz + 10 })] }));
    const sub = [[S.grade, S.subject].filter(Boolean).join('　'), S.timeMin ? `試験時間 ${S.timeMin}分` : '', kind === 'exam' && S.showTotal && num.total ? `${num.total}点満点` : ''].filter(Boolean).join('　／　');
    if (sub) out.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 60 }, children: [T(sub, { size: sz + 2 })] }));
    return out;
  }

  // ---------- 図版 ----------
  function imageParas(b, width) {
    const info = num.blocks.get(b.id) || {};
    const out = [];
    if (!b.dataUrl) return out;
    let wPx = Math.round((width / 15) * (b.widthPct || 70) / 100);
    let hPx = Math.round(wPx * (b.h || 1) / (b.w || 1));
    const maxH = Math.round((pageH / 15) * 0.8);
    if (hPx > maxH) { wPx = Math.round(wPx * maxH / hPx); hPx = maxH; }
    out.push(new Paragraph({
      alignment: b.align === 'left' ? AlignmentType.LEFT : AlignmentType.CENTER,
      keepNext: true, spacing: { before: 100, after: 40, line: 240, lineRule: LineRuleType.AUTO },
      children: [new ImageRun({ type: b.fmt === 'jpg' ? 'jpg' : 'png', data: dataUrlToBytes(b.dataUrl), transformation: { width: wPx, height: hPx } })],
    }));
    const cap = [b.showLabel !== false ? info.label : '', (b.caption || '').trim()].filter(Boolean).join('　');
    if (cap) out.push(new Paragraph({ alignment: b.align === 'left' ? AlignmentType.LEFT : AlignmentType.CENTER, keepNext: !!b.source, spacing: { after: b.source ? 0 : 120 }, children: [T(cap, { size: sz - 1 })] }));
    if ((b.source || '').trim()) {
      const s = b.source.trim();
      out.push(new Paragraph({ alignment: AlignmentType.RIGHT, spacing: { after: 120 }, children: [T(/^[（(]/.test(s) ? s : `（出典：${s}）`, { size: sz - 3 })] }));
    }
    return out;
  }

  // ---------- 論述のマス目 ----------
  function essayGrid(chars, width, indent = 0) {
    const numW = 520;
    let cols = 20;
    let cell = Math.floor((width - numW) / cols);
    if (cell < 330) { cols = Math.max(10, Math.floor((width - numW) / 330)); cell = Math.floor((width - numW) / cols); }
    cell = Math.min(cell, 560);
    const rows = Math.max(1, Math.ceil((Number(chars) || 100) / cols));
    const thin = line(4, '7F7F7F');
    const trs = [];
    for (let r = 0; r < rows; r++) {
      const cells = [];
      for (let c = 0; c < cols; c++) {
        cells.push(new TableCell({ width: { size: cell, type: WidthType.DXA }, borders: { top: thin, bottom: thin, left: thin, right: thin }, children: [new Paragraph({ children: [] })] }));
      }
      cells.push(new TableCell({ width: { size: numW, type: WidthType.DXA }, borders: noBorders, verticalAlign: VerticalAlign.BOTTOM, children: [new Paragraph({ indent: { left: 60 }, children: [T(String(Math.min((r + 1) * cols, Number(chars) || (r + 1) * cols)), { size: 12 })] })] }));
      trs.push(new TableRow({ height: { value: cell, rule: HeightRule.EXACT }, cantSplit: true, children: cells }));
    }
    return [
      new Table({ indent: { size: indent, type: WidthType.DXA }, width: { size: cell * cols + numW, type: WidthType.DXA }, columnWidths: [...Array(cols).fill(cell), numW], layout: TableLayoutType.FIXED, borders: tableNoBorders, rows: trs }),
      spacer(120),
    ];
  }

  // ---------- 問題本文 ----------
  function examBody() {
    const out = [];
    for (const b of state.blocks) {
      const info = num.blocks.get(b.id) || {};
      if (b.type === 'daimon') {
        const g = info.group;
        const kids = [T(info.label, { bold: true, size: sz + 4 }), T('　' + (b.title || ''), { bold: true })];
        if (S.showDaimonPoints && g && g.shownPoints) kids.push(new TextRun({ children: [new Tab(), `（配点 ${g.shownPoints}）`], size: sz - 1 }));
        out.push(new Paragraph({
          keepNext: true, spacing: { before: 300, after: 120 },
          border: { bottom: { style: BorderStyle.SINGLE, size: 8, color: '000000', space: 2 } },
          tabStops: [{ type: TabStopType.RIGHT, position: colW }],
          children: kids,
        }));
      } else if (b.type === 'text') {
        const lines = splitRunLines(b.body);
        lines.forEach((ln, i) => out.push(new Paragraph({ spacing: { after: i === lines.length - 1 ? 120 : 0 }, children: runsToTR(ln) })));
      } else if (b.type === 'shiryo') {
        out.push(new Paragraph({ keepNext: true, spacing: { before: 120, after: 40 }, children: [T(info.label || '史料', { bold: true })] }));
        const paras = splitRunLines(b.body).map((ln) => new Paragraph({ spacing: { after: 0 }, children: runsToTR(ln) }));
        if ((b.source || '').trim()) {
          const s = b.source.trim();
          paras.push(new Paragraph({ alignment: AlignmentType.RIGHT, spacing: { before: 60 }, children: [T(/^[（(]/.test(s) ? s : `（${s}）`, { size: sz - 2 })] }));
        }
        out.push(new Table({
          width: { size: colW, type: WidthType.DXA }, columnWidths: [colW], layout: TableLayoutType.FIXED,
          rows: [new TableRow({ children: [new TableCell({ width: { size: colW, type: WidthType.DXA }, borders: allBorders(8), margins: { top: 120, bottom: 120, left: 180, right: 180 }, children: paras.length ? paras : [new Paragraph({ children: [] })] })] })],
        }));
        out.push(spacer(120));
      } else if (b.type === 'image') {
        out.push(...imageParas(b, colW));
      } else if (b.type === 'question') {
        const lab = info.label || '';
        const hang = Math.round((charUnits(lab) + 1) * CH);
        const kids = [T(lab, { bold: true }), T('　'), ...runsToTR(b.body)];
        if (S.showQPoints && Number(b.points)) kids.push(T(`（${b.points}点）`, { size: sz - 2 }));
        out.push(new Paragraph({ indent: { left: hang, hanging: hang }, spacing: { before: 120, after: 40 }, keepNext: !!(b.choices && b.choices.length), children: kids }));
        const chs = b.choices || [];
        if (chs.length) {
          const layout = b.choiceLayout || 'v';
          if (layout === 'v') {
            const cw = Math.round((charUnits(choiceLabel(b.choiceStyle, chs.length)) + 1) * CH);
            chs.forEach((c, i) => out.push(new Paragraph({ indent: { left: hang + cw, hanging: cw }, spacing: { after: 0 }, keepNext: i < chs.length - 1, children: [T(choiceLabel(b.choiceStyle, i + 1) + '　'), ...runsToTR(c)] })));
          } else {
            const n = layout === 'h2' ? 2 : 4;
            const w = colW - hang;
            const cw = Math.floor(w / n);
            const rows = [];
            for (let i = 0; i < chs.length; i += n) {
              const cells = [];
              for (let j = 0; j < n; j++) {
                const c = chs[i + j];
                cells.push(new TableCell({ width: { size: cw, type: WidthType.DXA }, borders: noBorders, children: [new Paragraph({ children: c ? [T(choiceLabel(b.choiceStyle, i + j + 1) + '　'), ...runsToTR(c)] : [] })] }));
              }
              rows.push(new TableRow({ cantSplit: true, children: cells }));
            }
            out.push(new Table({ indent: { size: hang, type: WidthType.DXA }, width: { size: cw * n, type: WidthType.DXA }, columnWidths: Array(n).fill(cw), layout: TableLayoutType.FIXED, borders: tableNoBorders, rows }));
          }
        }
        if (b.answerType === 'essay' && !S.outAnswerSheet) out.push(spacer(60), ...essayGrid(b.essayChars, colW - hang, hang));
        else out.push(spacer(60));
      } else if (b.type === 'pagebreak') {
        out.push(new Paragraph({ children: [new PageBreak()] }));
      }
    }
    return out;
  }

  // ---------- 解答・解説 ----------
  function answerKey() {
    const out = [];
    out.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 40 }, children: [T('解答・解説', { bold: true, size: sz + 8 })] }));
    out.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 200 }, children: [T([S.title, S.grade, S.subject].filter(Boolean).join('　'), { size: sz })] }));
    for (const g of num.groups) {
      if (!g.questions.length && !g.blanks.length) continue;
      if (g.daimon) {
        out.push(new Paragraph({
          keepNext: true, spacing: { before: 240, after: 100 },
          border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: '000000', space: 2 } },
          tabStops: [{ type: TabStopType.RIGHT, position: KP.contentW }],
          children: [T(g.label, { bold: true, size: sz + 2 }), new TextRun({ children: [new Tab(), `（${g.shownPoints}点）`] })],
        }));
      }
      if (g.blanks.length) {
        const kids = [T('空欄　', { bold: true })];
        g.blanks.forEach((m, i) => {
          const info = num.marks.get(m.id);
          if (i) kids.push(T('　　'));
          kids.push(T(info ? info.core : '', { bold: true }), T('　' + (m.ans || '')));
        });
        out.push(new Paragraph({ spacing: { after: 100 }, children: kids }));
      }
      for (const q of g.questions) {
        const info = num.blocks.get(q.id) || {};
        const hang = Math.round((charUnits(info.label || '') + 1) * CH);
        const a = (q.answer || '').trim() || (q.answerType === 'essay' ? '（解答例は解説を参照）' : '');
        out.push(new Paragraph({
          indent: { left: hang, hanging: hang }, spacing: { before: 80, after: 20 }, keepNext: !!q.explanation,
          children: [T(info.label || '', { bold: true }), T('　'), T(a, { bold: true }), Number(q.points) ? T(`　（${q.points}点）`, { size: sz - 2 }) : T('')],
        }));
        if ((q.explanation || '').trim()) {
          const lines = q.explanation.trim().split('\n');
          const kids = [T('解説　', { color: '555555' })];
          lines.forEach((l, i) => { if (i) kids.push(new TextRun({ break: 1 })); kids.push(T(l)); });
          out.push(new Paragraph({ indent: { left: hang }, spacing: { after: 80 }, children: kids }));
        }
      }
    }
    return out;
  }

  // ---------- 解答用紙 ----------
  function answerSheet() {
    const out = [];
    out.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 40 }, children: [T('解答用紙', { bold: true, size: sz + 8 })] }));
    out.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 160 }, children: [T([S.title, S.grade, S.subject].filter(Boolean).join('　'), { size: sz })] }));
    // 氏名・得点欄
    const w1 = Math.round(fullW * 0.36), w2 = Math.round(fullW * 0.08), w4 = Math.round(fullW * 0.08), w5 = Math.round(fullW * 0.14);
    const w3 = fullW - w1 - w2 - w4 - w5;
    const shade = { type: ShadingType.CLEAR, fill: 'EDEDED', color: 'auto' };
    const cellP = (t, o = {}) => new Paragraph({ alignment: AlignmentType.CENTER, children: t ? [T(t, o)] : [] });
    out.push(new Table({
      width: { size: fullW, type: WidthType.DXA }, columnWidths: [w1, w2, w3, w4, w5], layout: TableLayoutType.FIXED,
      rows: [new TableRow({
        height: { value: 640, rule: HeightRule.ATLEAST },
        children: [
          new TableCell({ width: { size: w1, type: WidthType.DXA }, borders: allBorders(6), verticalAlign: VerticalAlign.CENTER, children: [cellP('（　　）年（　　）組（　　）番')] }),
          new TableCell({ width: { size: w2, type: WidthType.DXA }, borders: allBorders(6), shading: shade, verticalAlign: VerticalAlign.CENTER, children: [cellP('氏名')] }),
          new TableCell({ width: { size: w3, type: WidthType.DXA }, borders: allBorders(6), children: [cellP('')] }),
          new TableCell({ width: { size: w4, type: WidthType.DXA }, borders: allBorders(6), shading: shade, verticalAlign: VerticalAlign.CENTER, children: [cellP('得点')] }),
          new TableCell({ width: { size: w5, type: WidthType.DXA }, borders: allBorders(12), children: [cellP('')] }),
        ],
      })],
    }));
    out.push(spacer(120));
    for (const g of num.groups) {
      // 解答欄の並びを作る
      const entries = [];
      const blanks = [...g.blanks];
      let blanksPlaced = false;
      for (const q of g.questions) {
        const info = num.blocks.get(q.id) || {};
        const plain = runsToPlain(q.body, num);
        if (!blanksPlaced && blanks.length && /空欄/.test(plain) && !(q.answer || '').trim()) {
          blanks.forEach((m) => entries.push({ label: `${info.label} ${num.marks.get(m.id).core}`, kind: 'word' }));
          blanksPlaced = true;
          continue;
        }
        entries.push({ label: info.label, kind: q.answerType || 'symbol', chars: q.essayChars });
      }
      if (!blanksPlaced && blanks.length) entries.unshift(...blanks.map((m) => ({ label: '空欄' + num.marks.get(m.id).core, kind: 'word' })));
      if (!entries.length) continue;
      out.push(new Paragraph({
        keepNext: true, spacing: { before: 200, after: 80 },
        tabStops: [{ type: TabStopType.RIGHT, position: fullW }],
        children: [T(g.label || '', { bold: true, size: sz + 2 }), S.showDaimonPoints && g.shownPoints ? new TextRun({ children: [new Tab(), `（${g.shownPoints}点）`], size: sz - 1 }) : T('')],
      }));
      // 同じ種類が続く欄をまとめて表にする
      let i = 0;
      while (i < entries.length) {
        const kindNow = entries[i].kind;
        if (kindNow === 'essay') {
          const e = entries[i];
          out.push(new Paragraph({ keepNext: true, spacing: { before: 60, after: 40 }, children: [T(e.label, { bold: true }), T(`　（${e.chars}字）`, { size: sz - 2 })] }));
          out.push(...essayGrid(e.chars, fullW, 0));
          i++;
          continue;
        }
        const group = [];
        while (i < entries.length && entries[i].kind === kindNow) group.push(entries[i++]);
        const perRow = Math.max(2, Math.floor(fullW / (kindNow === 'symbol' ? 1900 : 3300)));
        const slot = Math.floor(fullW / perRow);
        const labW = Math.min(Math.max(...group.map((e) => Math.round(charUnits(e.label) * CH + 240))), Math.round(slot * 0.5));
        const boxW = slot - labW;
        const rows = [];
        for (let k = 0; k < group.length; k += perRow) {
          const cells = [];
          for (let j = 0; j < perRow; j++) {
            const e = group[k + j];
            if (e) {
              cells.push(new TableCell({ width: { size: labW, type: WidthType.DXA }, borders: allBorders(6), shading: shade, verticalAlign: VerticalAlign.CENTER, children: [cellP(e.label, { size: sz - 1 })] }));
              cells.push(new TableCell({ width: { size: boxW, type: WidthType.DXA }, borders: allBorders(6), children: [new Paragraph({ children: [] })] }));
            } else {
              cells.push(new TableCell({ width: { size: labW, type: WidthType.DXA }, borders: noBorders, children: [new Paragraph({ children: [] })] }));
              cells.push(new TableCell({ width: { size: boxW, type: WidthType.DXA }, borders: noBorders, children: [new Paragraph({ children: [] })] }));
            }
          }
          rows.push(new TableRow({ height: { value: 700, rule: HeightRule.ATLEAST }, cantSplit: true, children: cells }));
        }
        const widths = [];
        for (let j = 0; j < perRow; j++) widths.push(labW, boxW);
        out.push(new Table({ width: { size: slot * perRow, type: WidthType.DXA }, columnWidths: widths, layout: TableLayoutType.FIXED, rows }));
        out.push(spacer(80));
      }
    }
    return out;
  }

  // ---------- セクション ----------
  const pageProps = (extra = {}, PP = P) => ({
    page: {
      size: { width: PP.w, height: PP.h, orientation: PP.land ? PageOrientation.LANDSCAPE : PageOrientation.PORTRAIT },
      margin: { top: PP.margin, bottom: PP.margin, left: PP.margin, right: PP.margin, header: 567, footer: 454 },
    },
    ...extra,
  });
  const footers = { default: new Footer({ children: [new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ children: ['－ ', PageNumber.CURRENT, ' －'], size: sz - 3 })] })] }) };
  const sections = [];
  if (kind === 'exam') {
    const head = headerBlock(S.title || '問題');
    if (S.showNameLine) head.push(nameLine());
    else head.push(spacer(120));
    const body = examBody();
    if (P.cols > 1) {
      sections.push({ properties: pageProps({ column: { count: 1 } }), footers, children: head });
      sections.push({ properties: pageProps({ type: SectionType.CONTINUOUS, column: { count: P.cols, space: P.space, equalWidth: true } }), footers, children: body });
    } else {
      sections.push({ properties: pageProps(), footers, children: [...head, ...body] });
    }
    if (S.outAnswerSheet) sections.push({ properties: pageProps({ type: SectionType.NEXT_PAGE, column: { count: 1 } }), footers, children: answerSheet() });
    if (S.outAnswers) sections.push({ properties: pageProps({ type: SectionType.NEXT_PAGE, column: { count: 1 } }, KP), footers, children: answerKey() });
  } else if (kind === 'answers') {
    sections.push({ properties: pageProps({}, KP), footers, children: answerKey() });
  } else {
    sections.push({ properties: pageProps(), footers, children: answerSheet() });
  }

  return new Document({
    creator: '地歴公民 作問アシスタント',
    title: `${S.title} ${S.subject}`,
    styles: {
      default: {
        document: {
          run: { font: FONT, size: sz },
          paragraph: { spacing: { line: 300, lineRule: LineRuleType.AUTO } },
        },
      },
    },
    sections,
  });
}

// ===== 09 画面の組み立て・起動 =====
function setTab(t) {
  state.tab = t;
  for (const b of $$('[data-tab]')) b.classList.toggle('tab-on', b.dataset.tab === t);
  for (const p of $$('[data-panel]')) p.classList.toggle('hidden', p.dataset.panel !== t);
  if (t === 'answers') renderAnswers();
  if (t === 'editor') refreshLabels();
}

function renderViewerChrome() {
  const sel = $('#doc-select');
  sel.textContent = '';
  for (const d of state.docs) sel.appendChild(h('option', { value: d.id, selected: d.id === state.docId }, d.name));
  sel.classList.toggle('hidden', state.docs.length < 2);
  const name = $('#doc-name');
  const d = curDoc();
  name.textContent = d ? d.name : '';
  name.title = d ? d.name : '';
  name.classList.toggle('hidden', state.docs.length >= 2);
  updatePageInfo();
}

  pageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') gotoPage(pageInput.value); });
  const docSel = h('select', { id: 'doc-select', class: 'input input-sm max-w-[12rem] hidden' });
  docSel.addEventListener('change', () => { state.docId = docSel.value; state.page = 1; state.selRect = null; renderViewerChrome(); renderPage(); });
  const seg = h('div', { class: 'seg' },
    h('button', { type: 'button', id: 'mode-select', class: 'seg-btn seg-on', title: 'ドラッグで範囲を選ぶ', onClick: () => setMode('select') }, icon('select'), h('span', { class: 'hidden xl:inline' }, '範囲選択')),
    h('button', { type: 'button', id: 'mode-pan', class: 'seg-btn', title: '画面を動かす（タブレット向け）', onClick: () => setMode('pan') }, icon('hand'), h('span', { class: 'hidden xl:inline' }, 'スクロール')));
  tb.append(
    btn('PDFを開く', { icon: 'upload', kind: 'primary', small: true, onClick: () => $('#file-pdf').click() }),
    docSel,
    h('span', { id: 'doc-name', class: 'text-xs text-slate-600 truncate max-w-[10rem]' }),
    h('span', { class: 'flex-1' }),
    btn('', { icon: 'left', small: true, title: '前のページ（←）', onClick: () => gotoPage(state.page - 1) }),
    pageInput,
    h('span', { id: 'page-total', class: 'text-xs text-slate-500 tabular-nums w-10' }, '/ -'),
    btn('', { icon: 'right', small: true, title: '次のページ（→）', onClick: () => gotoPage(state.page + 1) }),
    h('span', { class: 'w-px h-5 bg-slate-300 mx-1' }),
    btn('', { icon: 'zoomOut', small: true, title: '縮小', onClick: () => setZoom(state.zoom / 1.2) }),
    h('span', { id: 'zoom-label', class: 'text-xs text-slate-600 tabular-nums w-10 text-center' }, '100%'),
    btn('', { icon: 'zoomIn', small: true, title: '拡大', onClick: () => setZoom(state.zoom * 1.2) }),
    btn('', { icon: 'fit', small: true, title: '幅に合わせる', onClick: () => setZoom(1) }),
    h('span', { class: 'w-px h-5 bg-slate-300 mx-1' }),
    seg);
}

function initSplitter() {
  const sp = $('#splitter');
  const left = $('#left-pane');
  try { const w = localStorage.getItem('sakumon-left'); if (w) left.style.flexBasis = w; } catch (_) { /* noop */ }
  sp.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sp.setPointerCapture(e.pointerId);
    const main = $('#main').getBoundingClientRect();
    const move = (ev) => {
      const pct = clamp(((ev.clientX - main.left) / main.width) * 100, 25, 75);
      left.style.flexBasis = pct + '%';
    };
    const up = () => {
      sp.removeEventListener('pointermove', move);
      sp.removeEventListener('pointerup', up);
      try { localStorage.setItem('sakumon-left', left.style.flexBasis); } catch (_) { /* noop */ }
      renderPage();
    };
    sp.addEventListener('pointermove', move);
    sp.addEventListener('pointerup', up);
  });
}

function initDrop() {
  const pane = $('#left-pane');
  let depth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  document.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('drop', (e) => { if (hasFiles(e)) e.preventDefault(); });
  pane.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; depth++; pane.classList.add('drop-on'); });
  pane.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) pane.classList.remove('drop-on'); });
  pane.addEventListener('drop', (e) => {
    depth = 0;
    pane.classList.remove('drop-on');
    if (!hasFiles(e)) return;
    e.preventDefault();
    openPdfFiles(e.dataTransfer.files);
  });
}

function initKeys() {
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    const typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    if ($('#modal-root').children.length) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey && !typing) { e.preventDefault(); undo(); return; }
    if (typing) return;
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (curDoc()) { e.preventDefault(); gotoPage(state.page - 1); } }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (curDoc()) { e.preventDefault(); gotoPage(state.page + 1); } }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && state.selRect) { e.preventDefault(); deleteRect(state.selRect); }
    else if (e.key === 'Escape' && state.selRect) { state.selRect = null; renderRects(); }
  });
}

function initHeader() {
  $('#btn-help').addEventListener('click', openHelp);
  $('#btn-save').addEventListener('click', () => {
    const data = JSON.stringify(projectData());
    saveFile(`作問_${safeFileName(state.settings.subject)}_${todayStr()}.json`, new Blob([data], { type: 'application/json' }));
  });
  $('#btn-open').addEventListener('click', () => $('#file-proj').click());
  $('#file-proj').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const p = JSON.parse(await f.text());
      if (state.blocks.length || state.stock.length) {
        if (!(await uiConfirm('今の作業内容を、読み込む作業ファイルの内容で置き換えます。よろしいですか？\n（必要なら先に「作業ファイルを保存」してください）', '置き換える', true))) return;
      }
      pushUndo();
      loadProject(p);
      renderAll();
      changed();
      toast('作業ファイルを読み込みました', 'ok');
    } catch (err) {
      toast('読み込めませんでした：' + err.message, 'err', 6000);
    }
  });
  $('#btn-new').addEventListener('click', async () => {
    if (!(await uiConfirm('素材ストックと問題エディタを空にして、新しく始めますか？\n（書式の設定は残ります。直前の状態は「元に戻す」で戻せます）', '新しく始める', true))) return;
    pushUndo();
    state.stock = [];
    state.blocks = [];
    state.activeBlock = null;
    state.stockChecked.clear();
    renderAll();
    changed();
  });
  $('#file-pdf').addEventListener('change', (e) => { const fs = e.target.files; openPdfFiles(fs).finally(() => { e.target.value = ''; }); });
  $('#drop-open').addEventListener('click', () => $('#file-pdf').click());
  for (const b of $$('[data-tab]')) b.addEventListener('click', () => setTab(b.dataset.tab));
}

// 起動時の自己診断：部品ファイルがそろっているか
const REQUIRED_FILES = [
  'lib/pdfjs/pdf.min.mjs', 'lib/pdfjs/pdf.worker.min.mjs', 'lib/pdfjs/cmaps.json',
  'lib/docx.iife.js', 'lib/tesseract/tesseract.min.js', 'lib/tesseract/worker.min.js',
];
async function checkSetup() {
  const box = $('#setup-warning');
  const show = (nodes) => { box.replaceChildren(...nodes); box.classList.remove('hidden'); };
  if (location.protocol === 'file:') {
    show([h('b', null, 'index.html をファイルとして直接開いています。'), 'この開き方ではブラウザの制限でPDFを読み込めません。GitHub Pages などで公開したURL（https://〜）から開いてください。']);
    return;
  }
  const missing = [];
  await Promise.all(REQUIRED_FILES.map(async (f) => {
    try { const r = await fetch(rel(f), { method: 'HEAD', cache: 'no-store' }); if (!r.ok) missing.push(f); } catch (_) { missing.push(f); }
  }));
  if (!missing.length) return;
  show([
    h('b', null, `アプリの部品ファイルが ${missing.length} 個見つかりません。`),
    'このままではPDFの表示・OCR・Word出力が動きません。GitHubのリポジトリで、index.html と同じ場所に「lib」フォルダがフォルダのまま入っているか確認してください（lib の中に pdfjs・tesseract フォルダと docx.iife.js があるのが正しい形です）。',
    h('br'), h('span', { class: 'text-xs' }, '見つからないファイル：' + missing.join('、')),
  ]);
}

function renderAll() {
  renderStock();
  renderEditor();
  renderAnswers();
  setTab(state.tab);
}

async function init() {
  buildToolbar();
  initOverlay();
  initSplitter();
  initDrop();
  initKeys();
  initHeader();
  setMode('select');
  try {
    const saved = await IDB.get('project');
    if (saved && (saved.blocks?.length || saved.stock?.length)) {
      loadProject(saved);
      toast('前回の作業内容を復元しました（この端末に保存されていたもの）', 'ok', 4000);
      setSaveStatus('この端末に自動保存済み');
    } else if (saved) {
      state.settings = mergeSettings(saved.settings);
    }
  } catch (e) {
    setSaveStatus('この環境では自動保存できません（作業ファイル保存を使ってください）');
  }
  renderAll();
  renderRectList();
  let lastW = 0;
  const ro = new ResizeObserver(debounce(() => {
    const w = $('#viewer').clientWidth;
    if (Math.abs(w - lastW) > 4) { lastW = w; if (curDoc()) renderPage(); }
  }, 150));
  ro.observe($('#viewer'));
  getClaudeDownloads();
  checkSetup();
  // ライブラリの先読み（同じフォルダから）
  setTimeout(() => { ensurePdfjs().catch((e) => console.warn(e)); }, 300);
  window.__sakumon = { state, computeNumbering, buildDocx, ensureDocx, extractTextLayer, runOcr, renderCrop };
}

init();

</script>
