<body class="bg-slate-100 text-slate-800 antialiased">
<div id="app" class="flex flex-col h-screen min-h-0">
  <header class="flex items-center gap-3 px-4 h-14 bg-white border-b border-slate-200 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-teal-700 text-white flex items-center justify-center font-bold text-sm shrink-0">問</div>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold leading-tight truncate">地歴公民 作問アシスタント</h1>
        <p class="text-[11px] text-slate-500 leading-tight truncate">PDFの切り抜き → 問題の編集 → Word出力</p>
      </div>
    </div>
    <div class="hidden md:flex items-center gap-1.5 ml-2 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 text-[11px] font-semibold border border-emerald-200" title="PDF・画像・文章は、このブラウザの外へ送信されません">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      ブラウザ内で完結・外部送信なし
    </div>
    <span class="flex-1"></span>
    <span id="save-status" class="hidden lg:inline text-[11px] text-slate-500"></span>
    <button type="button" id="btn-new" class="btn btn-ghost btn-sm" title="新しく始める">新規</button>
    <button type="button" id="btn-open" class="btn btn-default btn-sm" title="保存した作業ファイル（.json）を開く">作業ファイルを開く</button>
    <button type="button" id="btn-save" class="btn btn-default btn-sm" title="作業内容をファイルに保存（別のPCで続きができます）">作業ファイルを保存</button>

// 文字列（画像データ）を共有したまま深いコピーを作る（メモリ節約）
function deepCopy(v) {
  if (Array.isArray(v)) return v.map(deepCopy);
  if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = deepCopy(v[k]); return o; }
  return v;
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false || k === true) continue;
    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}

// 要素ビルダー
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'selected') el.selected = !!v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  return append(el, kids);
}

function btn(label, opts = {}) {
  const { icon: ic, kind = 'default', onClick, title, small, keepSel, disabled, cls = '' } = opts;

  const k = { default: 'btn-default', primary: 'btn-primary', ghost: 'btn-ghost', danger: 'btn-danger', accent: 'btn-accent' }[kind];
  const b = h('button', { type: 'button', class: `${base} ${k} ${cls}`, title: title || null, disabled: disabled || null },
    ic ? icon(ic, small ? 'w-3.5 h-3.5' : 'w-4 h-4') : null, label ? h('span', null, label) : null);
  if (keepSel) {
    // 選択範囲を保ったまま押せるようにする
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') e.preventDefault(); });

  if (onClick) b.addEventListener('click', onClick);
  return b;
}

function selectEl(options, value, onChange, cls = 'input input-sm') {

  for (const [v, l] of options) s.appendChild(h('option', { value: v, selected: String(v) === String(value) }, l));
  s.addEventListener('change', () => onChange(s.value));

}

function toast(msg, kind = 'info', ms = 3200) {

  const el = h('div', { class: `toast ${c}` }, msg);

  setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, ms);

// モーダル
function modal({ title, body, footer, size = 'md', onClose }) {
  const root = $('#modal-root');
  const w = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl', xl: 'max-w-6xl' }[size];
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    wrap.remove();
    document.removeEventListener('keydown', onKey);
    onClose && onClose();
  };
  const onKey = (e) => { if (e.key === 'Escape' && root.lastElementChild === wrap) close(); };
  const panel = h('div', { class: `modal-panel ${w}` },
    h('div', { class: 'flex items-center justify-between px-5 py-3 border-b border-slate-200' },
      h('h2', { class: 'text-base font-bold text-slate-800' }, title),
      h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onClick: close, title: '閉じる' }, icon('x'))),
    h('div', { class: 'modal-body' }, body),
    footer ? h('div', { class: 'flex flex-wrap items-center justify-end gap-2 px-5 py-3 border-t border-slate-200 bg-slate-50 rounded-b-xl' }, footer) : null);
  const wrap = h('div', { class: 'modal-wrap' }, panel);
  wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) wrap.dataset.down = '1'; });
  wrap.addEventListener('click', (e) => { if (e.target === wrap && wrap.dataset.down === '1') close(); wrap.dataset.down = ''; });
  document.addEventListener('keydown', onKey);
  root.appendChild(wrap);
  return { close, el: panel };
}

function uiConfirm(message, okLabel = 'OK', danger = false) {
  return new Promise((resolve) => {
    let done = false;
    const m = modal({
      title: '確認', size: 'sm',
      body: h('p', { class: 'text-sm leading-relaxed whitespace-pre-wrap' }, message),
      footer: [
        btn('キャンセル', { onClick: () => { done = true; m.close(); resolve(false); } }),
        btn(okLabel, { kind: danger ? 'danger' : 'primary', onClick: () => { done = true; m.close(); resolve(true); } }),
      ],
      onClose: () => { if (!done) resolve(false); },
    });
  });
}

function uiPrompt(message, { password = false, value = '' } = {}) {
  return new Promise((resolve) => {
    let done = false;
    const inp = h('input', { class: 'input w-full mt-3', type: password ? 'password' : 'text', value });
    const ok = () => { done = true; m.close(); resolve(inp.value); };
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) ok(); });
    const m = modal({
      title: '入力', size: 'sm',
      body: h('div', null, h('p', { class: 'text-sm' }, message), inp),
      footer: [btn('キャンセル', { onClick: () => { done = true; m.close(); resolve(null); } }), btn('OK', { kind: 'primary', onClick: ok })],
      onClose: () => { if (!done) resolve(null); },
    });
    setTimeout(() => inp.focus(), 50);
  });
}

// スクリプト読み込み（同じフォルダ内のファイルのみ）
const _scriptCache = {};
function loadScript(path) {
  if (_scriptCache[path]) return _scriptCache[path];
  _scriptCache[path] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = rel(path);
    s.onload = res;
    s.onerror = () => { delete _scriptCache[path]; rej(new Error(path + ' を読み込めませんでした')); };
    document.head.appendChild(s);
  });
  return _scriptCache[path];
}

// テキストのコピー
async function copyText(text, okMsg = 'コピーしました') {
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg, 'ok');
    return true;
  } catch (e) {
    const ta = h('textarea', { style: { position: 'fixed', left: '-9999px', top: '0' } });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { /* noop */ }
    ta.remove();
    if (ok) toast(okMsg, 'ok');
    else toast('コピーできませんでした。テキスト欄を選択して手動でコピーしてください', 'warn', 5000);
    return ok;
  }
}

function dataUrlToBytes(dataUrl) {
  const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function dataUrlToBlob(dataUrl) {
  const mime = dataUrl.slice(5, dataUrl.indexOf(';'));
  return new Blob([dataUrlToBytes(dataUrl)], { type: mime });
}

async function copyImage(dataUrl) {
  try {
    let blob = dataUrlToBlob(dataUrl);
    if (blob.type !== 'image/png') {
      // クリップボードはPNGのみ対応のため変換
      const img = await loadImage(dataUrl);
      const c = h('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    }
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('画像をコピーしました。AIの入力欄に貼り付けできます', 'ok');
  } catch (e) {
    toast('この環境では画像をコピーできません。「画像を保存」を使ってください', 'warn', 5000);
  }
}

function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// ファイル保存（Claude上ではダウンロード機能、通常のWebではブラウザのダウンロード）
let _dlPromise = null;
function getClaudeDownloads() {
  if (_dlPromise) return _dlPromise;
  if (!(window.claude && typeof window.claude.use === 'function')) return (_dlPromise = Promise.resolve(null));
  _dlPromise = Promise.race([
    window.claude.use('downloads').catch(() => null),
    sleep(12000).then(() => null),
  ]);
  return _dlPromise;
}
async function saveFile(filename, data, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const dl = await getClaudeDownloads();
  if (dl) {
    try {
      await dl.save({ filename, data: blob });
      toast('保存しました：' + filename, 'ok');
    } catch (e) {
      if (e && e.code === 'declined') toast('保存をキャンセルしました', 'info');
      else if (e && e.code === 'rate_limited') toast('保存の確認画面が開いています。少し待ってからもう一度お試しください', 'warn', 5000);
      else toast('この画面では保存できませんでした（' + (e && e.code || 'error') + '）', 'err', 6000);
    }
    return;
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: filename, style: { display: 'none' } });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  toast('ダウンロードしました：' + filename, 'ok');
}

function safeFileName(s) {
  return (s || 'file').replace(/[\\/:*?"<>|\n\r\t]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80) || 'file';
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
}

const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'.split('');
const ROMAN = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ', 'Ⅵ', 'Ⅶ', 'Ⅷ', 'Ⅸ', 'Ⅹ', 'Ⅺ', 'Ⅻ'];
const toFW = (s) => String(s).replace(/[0-9A-Za-z]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0xFEE0));
function seq(kind, n) {
  switch (kind) {
    case 'kana': return KANA[n - 1] || 'ア' + n;
    case 'num': return String(n);
    case 'alpha': return n <= 26 ? String.fromCharCode(64 + n) : 'A' + n;
    case 'lower': return n <= 26 ? String.fromCharCode(96 + n) : 'a' + n;
    case 'circled': return CIRCLED[n - 1] || `(${n})`;
    case 'roman': return ROMAN[n - 1] || String(n);
    default: return String(n);
  }
}

// ----- IndexedDB（この端末のブラウザ内だけに保存） -----
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('chireki-sakumon', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = res;
      t.onerror = () => rej(t.error);
    });
  },
};

const BLANK_STYLES = [['kana', '（ ア ）'], ['num', '［ 1 ］'], ['alpha', '【 A 】'], ['lower', '（ a ）']];
const UL_STYLES = [['alpha', '下線部(a)'], ['num', '下線部(1)'], ['circled', '下線部①'], ['kana', '下線部ア']];
const DAIMON_STYLES = [['dai', '第１問'], ['roman', 'Ⅰ'], ['mon', '問１'], ['num', '１']];
const Q_STYLES = [['mon', '問１'], ['paren', '(1)'], ['circled', '①'], ['num', '１．']];
const CHOICE_STYLES = [['circled', '①②③④'], ['kana', 'アイウエ'], ['lower', 'abcd'], ['num', '1234']];
const SHIRYO_STYLES = [['alpha', '史料Ａ'], ['num', '史料１'], ['roman', '史料Ⅰ']];

function numStr(n) { return state.settings.numWidth === 'full' ? toFW(n) : String(n); }
function daimonLabel(n) {
  switch (state.settings.daimonStyle) {
    case 'roman': return seq('roman', n);
    case 'mon': return '問' + numStr(n);
    case 'num': return numStr(n);
    default: return '第' + numStr(n) + '問';
  }
}
function qLabel(n) {
  switch (state.settings.questionStyle) {
    case 'paren': return `(${n})`;
    case 'circled': return seq('circled', n);
    case 'num': return numStr(n) + '．';
    default: return '問' + numStr(n);
  }
}
function blankCore(style, n) { return seq(style, n); }
function blankText(style, core, padN) {
  const pad = '　'.repeat(padN == null ? state.settings.blankPad : padN);
  const br = { kana: ['（', '）'], num: ['［', '］'], alpha: ['【', '】'], lower: ['（', '）'] }[style] || ['（', '）'];
  return br[0] + pad + core + pad + br[1];
}
function ulCore(style, n) { return seq(style === 'alpha' ? 'lower' : style, n); }
function ulText(style, core) {
  if (style === 'circled' || style === 'kana') return core;
  return `(${core})`;
}
function choiceLabel(style, n) { return seq(style, n); }
function shiryoLabel(n) {
  const st = state.settings.shiryoStyle;
  if (st === 'num') return '史料' + numStr(n);
  if (st === 'roman') return '史料' + seq('roman', n);
  return '史料' + toFW(seq('alpha', n));
}

// ブロック内のリッチテキスト欄を出現順に
function blockRunFields(b) {
  if (b.type === 'text' || b.type === 'shiryo') return [b.body || []];
  if (b.type === 'question') return [b.body || [], ...(b.choices || [])];
  return [];
}

// 番号の計算（エディタ表示とWord出力で共通）
function computeNumbering() {
  const S = state.settings;
  const res = { blocks: new Map(), marks: new Map(), groups: [], total: 0 };
  let d = 0, q = 0, shi = 0, fig = 0;
  let cb = {}, cu = {};
  let group = { daimon: null, label: '', items: [], points: 0, blanks: [], questions: [] };
  res.groups.push(group);
  for (const b of state.blocks) {
    if (b.type === 'daimon') {
      d++;
      if (S.resetQ) q = 0;
      if (S.resetMarks) { cb = {}; cu = {}; shi = 0; fig = 0; }
      group = { daimon: b, label: daimonLabel(d), items: [], points: 0, blanks: [], questions: [] };
      res.groups.push(group);
      res.blocks.set(b.id, { label: group.label, group });
      continue;
    }
    group.items.push(b);
    if (b.type === 'question') {
      q++;
      const p = Number(b.points) || 0;
      group.points += p;
      res.blocks.set(b.id, { label: qLabel(q), group });
      group.questions.push(b);
    } else if (b.type === 'shiryo') {
      shi++;
      res.blocks.set(b.id, { label: (b.label || '').trim() || shiryoLabel(shi), auto: shiryoLabel(shi), group });
    } else if (b.type === 'image') {
      fig++;
      res.blocks.set(b.id, { label: S.figurePrefix + numStr(fig), group });
    } else {
      res.blocks.set(b.id, { label: '', group });
    }
    for (const runs of blockRunFields(b)) {
      for (const r of runs) {
        if (r.t === 'b') {
          const st = r.style || 'kana';
          cb[st] = (cb[st] || 0) + 1;
          const core = blankCore(st, cb[st]);
          res.marks.set(r.id, { core, text: blankText(st, core), group, mark: r });
          group.blanks.push(r);
        } else if (r.t === 'u') {
          const st = r.style || 'alpha';
          cu[st] = (cu[st] || 0) + 1;
          const core = ulCore(st, cu[st]);
          res.marks.set(r.id, { core, text: ulText(st, core), group, mark: r });
        }
      }
    }
  }
  for (const g of res.groups) {
    if (g.daimon && g.daimon.points !== '' && g.daimon.points != null && !isNaN(Number(g.daimon.points))) g.shownPoints = Number(g.daimon.points);
    else g.shownPoints = g.points;
    res.total += g.shownPoints;
  }
  // 大問がない先頭グループが空なら除外
  if (!res.groups[0].items.length) res.groups.shift();
  return res;
}

function newBlock(type, extra = {}) {
  const base = { id: uid(), type };
  switch (type) {
    case 'daimon': return { ...base, title: '次の文章を読み、後の問いに答えよ。', points: '', ...extra };
    case 'text': return { ...base, body: [], ...extra };
    case 'shiryo': return { ...base, label: '', body: [], source: '', ...extra };
    case 'question': return { ...base, body: [], choices: [], choiceStyle: 'circled', choiceLayout: 'v', answerType: 'symbol', essayChars: 100, points: 2, answer: '', explanation: '', ...extra };
    case 'image': return { ...base, dataUrl: '', w: 1, h: 1, fmt: 'png', widthPct: 70, caption: '', source: '', showLabel: true, align: 'center', origin: '', ...extra };
    case 'pagebreak': return { ...base };
    default: return base;
  }
}

function textToRuns(t) { return t ? [{ t: 's', v: t }] : []; }
function runsToPlain(runs, num) {
  return (runs || []).map((r) => {
    if (r.t === 's') return r.v;
    const m = num && num.marks.get(r.id);
    if (r.t === 'b') return m ? m.text : `（${r.ans}）`;
    if (r.t === 'u') return (m ? m.text : '') + r.v;
    return '';
  }).join('');
}

// AIの出力内の {{語句}} と [[語句]] を空欄・下線部に
function markupToRuns(str) {
  const runs = [];
  const s = String(str == null ? '' : str);
  const re = /\{\{([^{}]+?)\}\}|\[\[([^[\]]+?)\]\]/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) runs.push({ t: 's', v: s.slice(last, m.index) });
    if (m[1] != null) runs.push({ t: 'b', id: uid(), ans: m[1].trim(), style: state.settings.blankStyle });
    else runs.push({ t: 'u', id: uid(), v: m[2], style: state.settings.ulStyle });
    last = re.lastIndex;
  }
  if (last < s.length) runs.push({ t: 's', v: s.slice(last) });
  return runs;
}

// ===== 03 PDFビューア・範囲選択・抽出 =====
let pdfjsLib = null;
async function ensurePdfjs() {
  if (pdfjsLib) return pdfjsLib;
  if (!globalThis.pdfjsLib) {
    try {
      await import('./lib/pdfjs/pdf.min.mjs');
    } catch (e) {
      if (location.protocol === 'file:') throw new Error('index.html を直接開いているため部品を読み込めません。公開したURLから開いてください');
      const r = await fetch(rel('lib/pdfjs/pdf.min.mjs'), { method: 'HEAD', cache: 'no-store' }).catch(() => null);
      if (!r || !r.ok) throw new Error('部品ファイル lib/pdfjs/pdf.min.mjs が見つかりません。lib フォルダが index.html と同じ場所に、フォルダのままアップロードされているか確認してください');
      throw e;
    }
  }
  pdfjsLib = globalThis.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = rel('lib/pdfjs/pdf.worker.min.mjs');
  return pdfjsLib;
}

// 日本語用のCMap（169ファイル）を1つにまとめた cmaps.json から読む
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
let _cmapPack = null;
function loadCMapPack() {
  if (_cmapPack) return _cmapPack;
  _cmapPack = (async () => {
    const r = await fetch(rel('lib/pdfjs/cmaps.json'));
    if (!r.ok) throw new Error('cmaps.json を読み込めませんでした');
    return r.json();
  })();
  _cmapPack.catch(() => { _cmapPack = null; });
  return _cmapPack;
}
class PackedDataFactory {
  constructor(opts) { this.opts = opts || {}; }
  async fetch({ kind, filename }) {
    if (kind === 'cMapUrl') {
      const pack = await loadCMapPack();
      const d = pack[filename];
      if (!d) throw new Error('CMapが見つかりません：' + filename);
      return b64ToBytes(d);
    }
    const base = kind === 'standardFontDataUrl' ? 'lib/pdfjs/standard_fonts/' : 'lib/pdfjs/wasm/';
    const r = await fetch(rel(base + filename));
    if (!r.ok) throw new Error('読み込めませんでした：' + filename);
    return new Uint8Array(await r.arrayBuffer());
  }
}

const curDoc = () => state.docs.find((d) => d.id === state.docId) || null;

async function openPdfFiles(files) {
  const list = Array.from(files || []).filter((f) => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!list.length) { toast('PDFファイルを選んでください', 'warn'); return; }
  for (const f of list) await openPdf(f);
}

async function openPdf(file) {
  const busy = showBusy(`「${file.name}」を読み込み中…`);
  try {
    const lib = await ensurePdfjs();
    const data = new Uint8Array(await file.arrayBuffer());
    const task = lib.getDocument({
      data,
      cMapUrl: rel('lib/pdfjs/cmaps/'),
      cMapPacked: true,
      standardFontDataUrl: rel('lib/pdfjs/standard_fonts/'),
      wasmUrl: rel('lib/pdfjs/wasm/'),
      BinaryDataFactory: PackedDataFactory,
      useWorkerFetch: false,
      isEvalSupported: false,
      enableXfa: false,
      useSystemFonts: true,
    });
    task.onPassword = async (update, reason) => {
      busy.hide();
      const pw = await uiPrompt(reason === 2 ? 'パスワードが違います。もう一度入力してください。' : `「${file.name}」はパスワードで保護されています。パスワードを入力してください。`, { password: true });
      if (pw == null) { task.destroy(); return; }
      busy.show();
      update(pw);
    };
    const pdf = await task.promise;
    const doc = { id: uid(), name: file.name.replace(/\.pdf$/i, ''), pdf, numPages: pdf.numPages };
    state.docs.push(doc);
    state.docId = doc.id;
    state.page = 1;
    state.selRect = null;
    renderViewerChrome();
    await renderPage();
    toast(`「${doc.name}」を開きました（${doc.numPages}ページ）`, 'ok');
  } catch (e) {
    console.error(e);
    if (e && e.name === 'PasswordException') toast('PDFを開けませんでした（パスワード）', 'err');
    else toast('PDFを開けませんでした：' + (e && e.message ? e.message : e), 'err', 6000);
  } finally {
    busy.hide();
  }
}

let _busyEl = null;

  api.show();

}

// ---- ページ描画 ----
let _renderTask = null;
let _renderSeq = 0;
let _pageBase = { w: 595, h: 842 };
async function renderPage() {
  const doc = curDoc();
  const wrapEl = $('#page-wrap');
  const drop = $('#dropzone');
  if (!doc) { wrapEl.classList.add('hidden'); drop.classList.remove('hidden'); renderRectList(); return; }
  drop.classList.add('hidden');
  wrapEl.classList.remove('hidden');
  const seqNo = ++_renderSeq;
  const page = await doc.pdf.getPage(state.page);
  if (seqNo !== _renderSeq) return;
  const base = page.getViewport({ scale: 1 });
  _pageBase = { w: base.width, h: base.height };
  const viewer = $('#viewer');
  const avail = Math.max(240, viewer.clientWidth - 32);
  const scale = (avail / base.width) * state.zoom;
  const vp = page.getViewport({ scale });
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const canvas = $('#page-canvas');
  const off = document.createElement('canvas');
  off.width = Math.floor(vp.width * dpr);
  off.height = Math.floor(vp.height * dpr);
  const ctx = off.getContext('2d');
  if (_renderTask) { try { _renderTask.cancel(); } catch (_) { /* noop */ } }
  _renderTask = page.render({ canvasContext: ctx, viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
  try {
    await _renderTask.promise;
  } catch (e) {
    if (e && e.name === 'RenderingCancelledException') return;
    console.error(e);
  }
  if (seqNo !== _renderSeq) return;
  canvas.width = off.width;
  canvas.height = off.height;
  canvas.getContext('2d').drawImage(off, 0, 0);
  wrapEl.style.width = vp.width + 'px';
  wrapEl.style.height = vp.height + 'px';
  canvas.style.width = vp.width + 'px';
  canvas.style.height = vp.height + 'px';
  updatePageInfo();
  renderRects();
}

function updatePageInfo() {
  const doc = curDoc();
  const inp = $('#page-input');
  if (inp) inp.value = state.page;
  const tot = $('#page-total');
  if (tot) tot.textContent = doc ? `/ ${doc.numPages}` : '/ -';
  const z = $('#zoom-label');
  if (z) z.textContent = Math.round(state.zoom * 100) + '%';
}

function gotoPage(n) {
  const doc = curDoc();
  if (!doc) return;
  n = clamp(Math.round(Number(n) || 1), 1, doc.numPages);
  if (n === state.page) { updatePageInfo(); return; }
  state.page = n;
  state.selRect = null;
  $('#viewer').scrollTop = 0;
  renderPage();
}
function setZoom(z) {
  state.zoom = clamp(Math.round(z * 100) / 100, 0.5, 4);
  renderPage();
}
function setMode(m) {
  state.mode = m;
  $('#overlay').classList.toggle('pan', m === 'pan');
  $('#mode-select').classList.toggle('seg-on', m === 'select');
  $('#mode-pan').classList.toggle('seg-on', m === 'pan');
}

// ---- 範囲（矩形）オーバーレイ ----
function normPoint(e) {
  const r = $('#overlay').getBoundingClientRect();
  return { x: clamp((e.clientX - r.left) / r.width, 0, 1), y: clamp((e.clientY - r.top) / r.height, 0, 1) };
}

let _drag = null;
function initOverlay() {
  const ov = $('#overlay');
  ov.addEventListener('pointerdown', (e) => {
    if (state.mode !== 'select' || !curDoc()) return;
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    if (e.target.closest('[data-actions]')) return;
    const p = normPoint(e);
    const handle = e.target.closest('[data-handle]');
    const rEl = e.target.closest('[data-rect]');
    if (handle && rEl) {
      const r = pageRects().find((x) => x.id === rEl.dataset.rect);
      _drag = { type: 'resize', r, h: handle.dataset.handle, start: p, orig: { ...r } };
    } else if (rEl) {
      const r = pageRects().find((x) => x.id === rEl.dataset.rect);
      state.selRect = r.id;
      _drag = { type: 'move', r, start: p, orig: { ...r } };
      renderRects();
    } else {
      _drag = { type: 'new', start: p, r: { id: uid(), x: p.x, y: p.y, w: 0, h: 0 } };
      state.selRect = null;
      renderRects();
    }
    ov.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  ov.addEventListener('pointermove', (e) => {
    if (!_drag) return;
    const p = normPoint(e);
    const { r, start, orig } = _drag;
    if (_drag.type === 'new') {
      r.x = Math.min(start.x, p.x); r.y = Math.min(start.y, p.y);
      r.w = Math.abs(p.x - start.x); r.h = Math.abs(p.y - start.y);
      drawTempRect(r);
    } else if (_drag.type === 'move') {
      r.x = clamp(orig.x + p.x - start.x, 0, 1 - orig.w);
      r.y = clamp(orig.y + p.y - start.y, 0, 1 - orig.h);
      positionRect(r);
    } else {
      let x0 = orig.x, y0 = orig.y, x1 = orig.x + orig.w, y1 = orig.y + orig.h;
      if (_drag.h.includes('w')) x0 = p.x;
      if (_drag.h.includes('e')) x1 = p.x;
      if (_drag.h.includes('n')) y0 = p.y;
      if (_drag.h.includes('s')) y1 = p.y;
      r.x = Math.min(x0, x1); r.y = Math.min(y0, y1); r.w = Math.abs(x1 - x0); r.h = Math.abs(y1 - y0);
      positionRect(r);
    }
  });
  const end = () => {
    if (!_drag) return;
    const d = _drag;
    _drag = null;
    if (d.type === 'new') {
      $('#temp-rect')?.remove();
      if (d.r.w * _pageBase.w > 8 && d.r.h * _pageBase.h > 8) {
        pageRects().push(d.r);
        state.selRect = d.r.id;
      }
    } else if (d.r.w * _pageBase.w < 6 || d.r.h * _pageBase.h < 6) {
      Object.assign(d.r, d.orig);
    }
    renderRects();
  };
  ov.addEventListener('pointerup', end);
  ov.addEventListener('pointercancel', end);
}

async function batchAdd(kind) {

        if (res.text.trim()) { state.stock.push(makeTextStock(res.text)); ok++; } else empty++;
      }

// ---- 切り抜き画像の生成 ----
async function renderCrop(docId, pageNum, r, dpi) {
  const doc = getDoc(docId);
  const page = await doc.pdf.getPage(pageNum);
  const base = page.getViewport({ scale: 1 });
  let scale = dpi / 72;
  let w = r.w * base.width * scale, hh = r.h * base.height * scale;
  const maxPx = 14e6;
  if (w * hh > maxPx) { const f = Math.sqrt(maxPx / (w * hh)); scale *= f; w *= f; hh *= f; }
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(hh));
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp, transform: [1, 0, 0, 1, -r.x * vp.width, -r.y * vp.height] }).promise;
  c._mmW = (r.w * base.width) / 72 * 25.4;
  return c;
}

function trimCanvas(src) {
  const ctx = src.getContext('2d');
  const { width: W, height: H } = src;
  const d = ctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (d[i] < 236 || d[i + 1] < 236 || d[i + 2] < 236) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return src;
  const pad = Math.round(Math.max(W, H) * 0.01) + 4;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const c = document.createElement('canvas');
  c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
  c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  c._mmW = (src._mmW || 0) * (c.width / W);
  return c;
}

// 白黒印刷向けの調整
function processCanvas(src, opt) {
  let c = opt.trim ? trimCanvas(src) : src;
  const out = document.createElement('canvas');
  out.width = c.width; out.height = c.height;
  out._mmW = c._mmW || src._mmW;
  const ctx = out.getContext('2d');
  ctx.drawImage(c, 0, 0);
  const B = Number(opt.brightness) || 0, C = Number(opt.contrast) || 0;
  if (opt.mode === 'color' && !B && !C) return out;
  const img = ctx.getImageData(0, 0, out.width, out.height);
  const d = img.data;
  const bb = B * 2.55;
  const cf = (259 * (C + 255)) / (255 * (259 - C));
  const th = Number(opt.threshold) || 160;
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    if (opt.mode !== 'color') { const y = 0.299 * r + 0.587 * g + 0.114 * b; r = g = b = y; }
    r = cf * (r - 128) + 128 + bb; g = cf * (g - 128) + 128 + bb; b = cf * (b - 128) + 128 + bb;
    if (opt.mode === 'bw') { const v = r >= th ? 255 : 0; r = g = b = v; }
    d[i] = r < 0 ? 0 : r > 255 ? 255 : r;
    d[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
    d[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
  }
  ctx.putImageData(img, 0, 0);
  return out;
}

function canvasToDataUrl(c, fmt) {
  return fmt === 'jpg' ? c.toDataURL('image/jpeg', 0.9) : c.toDataURL('image/png');
}

function srcInfo() {
  const d = curDoc();
  return { name: d ? d.name : '', page: state.page };
}
function makeImageStock(canvas, r, fmt = state.settings.img.fmt) {
  return { id: uid(), kind: 'image', dataUrl: canvasToDataUrl(canvas, fmt), w: canvas.width, h: canvas.height, fmt, mmW: canvas._mmW || 0, src: srcInfo(), at: Date.now() };
}
function makeTextStock(text) {
  return { id: uid(), kind: 'text', text, src: srcInfo(), at: Date.now() };
}

// ---- テキストレイヤーからの抽出 ----
const isWordChar = (c) => /[A-Za-z0-9À-ž'’\-.,;:!?()]/.test(c);
async function extractTextLayer(docId, pageNum, r, opt = {}) {
  const lib = await ensurePdfjs();
  const doc = getDoc(docId);
  const page = await doc.pdf.getPage(pageNum);
  const vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent();
  const X0 = r.x * vp.width, Y0 = r.y * vp.height, X1 = (r.x + r.w) * vp.width, Y1 = (r.y + r.h) * vp.height;
  const chars = [];
  let vCount = 0, hCount = 0, totalItems = 0;
  for (const it of tc.items) {
    if (!it || typeof it.str !== 'string' || !it.str) continue;
    totalItems++;
    const m = lib.Util.transform(vp.transform, it.transform);
    const style = tc.styles[it.fontName] || {};
    const vertical = !!style.vertical;
    let a = Math.atan2(m[1], m[0]);
    if (vertical) a += Math.PI / 2;
    const fs = Math.hypot(m[2], m[3]) || Math.hypot(m[0], m[1]) || 10;
    const glyphs = Array.from(it.str);
    const n = glyphs.length;
    const len = vertical ? (it.height || fs * n) : (it.width || fs * n * 0.6);
    const step = len / n;
    const dx = Math.cos(a), dy = Math.sin(a);
    const ux = Math.sin(a), uy = -Math.cos(a); // 文字の「上」方向
    for (let i = 0; i < n; i++) {
      const along = (i + 0.5) * step;
      const cx = m[4] + dx * along + ux * fs * 0.35;
      const cy = m[5] + dy * along + uy * fs * 0.35;
      if (cx < X0 || cx > X1 || cy < Y0 || cy > Y1) continue;
      chars.push({ ch: glyphs[i], cx, cy, fs, step, vertical });
      if (glyphs[i].trim()) { if (vertical) vCount++; else hCount++; }
    }
  }
  if (!chars.length) return { text: '', count: 0, totalItems, vertical: false };
  // ルビ（小さい文字）の除外
  const sizes = chars.filter((c) => c.ch.trim()).map((c) => c.fs).sort((x, y) => x - y);
  const med = sizes.length ? sizes[Math.floor(sizes.length / 2)] : 10;
  let list = opt.dropRuby ? chars.filter((c) => !c.ch.trim() || c.fs >= med * 0.62) : chars;
  const vertical = vCount > hCount;
  // 行（縦書きなら列）にまとめる
  const key = (c) => (vertical ? -c.cx : c.cy);
  const pos = (c) => (vertical ? c.cy : c.cx);
  list = list.slice().sort((p, q) => key(p) - key(q));
  const lines = [];
  for (const c of list) {
    const k = key(c);
    let line = lines.length ? lines[lines.length - 1] : null;
    if (!line || Math.abs(k - line.k) > med * 0.55) { line = { k, chars: [] }; lines.push(line); }
    line.chars.push(c);
    line.k = (line.k * (line.chars.length - 1) + k) / line.chars.length;
  }
  const texts = lines.map((ln) => {
    const cs = ln.chars.sort((p, q) => pos(p) - pos(q));
    let s = '';
    let prev = null;
    let pend = false; // 直前に空白文字があったか
    for (const c of cs) {
      if (!c.ch.trim()) { pend = true; continue; }
      if (prev) {
        const gap = pos(c) - pos(prev) - (c.step + prev.step) / 2;
        const word = isWordChar(c.ch) || isWordChar(prev.ch);
        if (word) { if (pend || gap > med * 0.28) s += ' '; }
        else if (pend || gap > med * 0.7) s += '　'.repeat(clamp(Math.round(gap / med), 1, 4));
      }
      s += c.ch;
      prev = c;
      pend = false;
    }
    s = s.replace(/[  ]{2,}/g, ' ').replace(/\s+$/, '').replace(/^ +/, '');
    const firstReal = cs.find((c) => c.ch.trim());
    const start = firstReal ? pos(firstReal) : 0;
    const ext = cs.length ? pos(cs[cs.length - 1]) - start : 0;
    return { s, ext, start };
  }).filter((x) => x.s);
  const text = joinLines(texts, opt.join || 'para', vertical);
  return { text: cleanupJa(text), count: list.filter((c) => c.ch.trim()).length, totalItems, vertical };
}

function joinLines(lines, mode, vertical = false) {
  if (mode === 'keep') return lines.map((l) => l.s).join('\n');
  if (mode === 'all') return lines.map((l) => l.s).join('').replace(/([A-Za-z0-9,.])([A-Za-z])/g, '$1$2');
  const maxExt = Math.max(...lines.map((l) => l.ext), 1);
  const minStart = Math.min(...lines.map((l) => l.start));
  const ends = (l) => /[。．！？!?」』）)]$/.test(l.s);
  const fsGuess = maxExt / Math.max(1, Math.max(...lines.map((l) => l.s.length)));
  const isIndented = (l) => l.start - minStart > fsGuess * 0.6 || /^[　]/.test(l.s);
  let out = '';
  lines.forEach((l, i) => {
    if (i === 0 && isIndented(l) && !/^[　]/.test(l.s) && lines.length > 1) out += '　';
    out += l.s;
    if (i === lines.length - 1) return;
    const nx = lines[i + 1];
    const short = l.start + l.ext < minStart + maxExt * 0.9;
    const indent = isIndented(nx);
    if ((short && (ends(l) || vertical || l.ext < maxExt * 0.75)) || indent) out +='\n' + (indent && !/^[　]/.test(nx.s) ? '　' : '');
    else if (/[A-Za-z0-9,.;:]$/.test(l.s) && /^[A-Za-z0-9(]/.test(nx.s)) out += ' ';
  });
  return out;
}

function cleanupJa(t) {
  const J = '　-ヿ㐀-鿿豈-﫿＀-￯';
  return t
    .replace(/[︐-︙︰-﹏]/g, (c) => c.normalize('NFKC'))
    .replace(new RegExp(`([${J}]) +(?=[${J}])`, 'g'), '$1')
    .replace(/\u0000/g, '')
    .replace(/[ \t]+\n/g, '\n');
}

// ---- OCR（この端末内で処理） ----
let _ocr = { worker: null, lang: null, cb: null };
async function getOcrWorker(lang, onProgress) {
  _ocr.cb = onProgress;
  if (_ocr.worker && _ocr.lang === lang) return _ocr.worker;
  if (_ocr.worker) { try { await _ocr.worker.terminate(); } catch (_) { /* noop */ } _ocr.worker = null; }
  await loadScript('lib/tesseract/tesseract.min.js');
  const langs = [];
  for (const code of lang.split('+')) langs.push({ code, data: await loadLangData(code) });
  _ocr.worker = await window.Tesseract.createWorker(langs, 1, {
    workerPath: rel('lib/tesseract/worker.min.js'),
    corePath: rel('lib/tesseract/core'),
    langPath: rel('lib/tesseract/lang'),
    gzip: true,
    cacheMethod: 'none',
    workerBlobURL: false,
    logger: (m) => _ocr.cb && _ocr.cb(m),
  });
  _ocr.lang = lang;
  return _ocr.worker;
}

// OCRの辞書（同じ場所の .gz、なければ .json）を読む
const _langCache = {};
function loadLangData(code) {
  if (_langCache[code]) return _langCache[code];
  _langCache[code] = (async () => {
    let r = await fetch(rel(`lib/tesseract/lang/${code}.traineddata.gz`)).catch(() => null);
    if (r && r.ok) return new Uint8Array(await r.arrayBuffer());
    r = await fetch(rel(`lib/tesseract/lang/${code}.traineddata.json`));
    if (!r.ok) throw new Error(`OCRの辞書（${code}）を読み込めませんでした`);
    return b64ToBytes((await r.json()).b64);
  })();
  _langCache[code].catch(() => { delete _langCache[code]; });
  return _langCache[code];
}

async function runOcr(canvas, vertical, onProgress) {
  const lang = vertical ? 'jpn_vert+jpn' : 'jpn+eng';
  const w = await getOcrWorker(lang, onProgress);
  await w.setParameters({ tessedit_pageseg_mode: vertical ? '5' : '3', preserve_interword_spaces: '1' });
  const { data } = await w.recognize(canvas);
  let t = data.text || '';
  t = cleanupJa(t).replace(/\n{3,}/g, '\n\n').trim();
  return t;
}

function makeImageStockFrom(canvas, fmt, ctx) {

// ---------- テキスト・史料として抽出 ----------
async function openTextModal(r) {
  const ctx = { docId: state.docId, page: state.page };
  const opt = { dropRuby: true, join: 'para', vertical: false };
  const ta = h('textarea', { class: 'input w-full font-mono-ja text-sm leading-relaxed', rows: 14, placeholder: '抽出したテキストがここに入ります。自由に修正できます。' });
  const status = h('div', { class: 'text-xs text-slate-600 min-h-[1.25rem]' });
  const prog = h('div', { class: 'progress hidden' }, h('div', { class: 'progress-bar', style: { width: '0%' } }));
  const prev = h('div', { class: 'img-preview max-h-[52vh]' }, h('div', { class: 'spinner' }));
  let crop = null;
  const runLayer = async () => {
    status.textContent = 'テキストレイヤーを読み取り中…';
    const res = await extractTextLayer(ctx.docId, ctx.page, r, opt);
    if (res.text.trim()) {
      ta.value = res.text;
      status.textContent = `PDFの文字データから ${res.count} 文字を取り出しました${res.vertical ? '（縦書きとして整理）' : ''}。文字化けしている場合は「OCRで読み取る」を使ってください。`;
      status.className = 'text-xs text-teal-700 min-h-[1.25rem]';
    } else {
      ta.value = '';
      status.textContent = res.totalItems ? 'この範囲には文字データがありません。「OCRで読み取る」を押してください。' : 'このPDFは画像のみ（スキャン）のようです。「OCRで読み取る」を押してください。';
      status.className = 'text-xs text-amber-700 min-h-[1.25rem]';
    }
  };
  const runOcrNow = async () => {
    if (!crop) return;
    prog.classList.remove('hidden');
    const bar = prog.firstChild;
    status.textContent = 'OCRの準備中…（初回は辞書の読み込みに少し時間がかかります）';
    status.className = 'text-xs text-slate-600 min-h-[1.25rem]';
    try {
      const big = await renderCrop(ctx.docId, ctx.page, r, 300);
      const g = processCanvas(big, { mode: 'gray', brightness: 0, contrast: 20, trim: false });
      const t = await runOcr(g, opt.vertical, (m) => {
        if (m.status === 'recognizing text') { bar.style.width = Math.round(m.progress * 100) + '%'; status.textContent = `OCRで読み取り中… ${Math.round(m.progress * 100)}%`; }
        else if (m.status) status.textContent = 'OCRの準備中…（' + m.status + '）';
      });
      ta.value = t;
      status.textContent = 'OCRで読み取りました（この端末の中で処理）。誤読があるので必ず確認・修正してください。';
      status.className = 'text-xs text-teal-700 min-h-[1.25rem]';
    } catch (e) {
      console.error(e);
      status.textContent = 'OCRに失敗しました：' + (e && e.message ? e.message : e) + '　→「画像をコピー」してAIに文字起こしを頼む方法も使えます。';
      status.className = 'text-xs text-rose-700 min-h-[1.25rem]';
    } finally {
      prog.classList.add('hidden');
    }
  };
  const ocrPrompt = 'この画像は高校の教科書・資料集の一部です。画像内の文章を、そのまま正確に文字起こししてください。\n・ルビ（ふりがな）は省く\n・段落の区切りだけ改行し、行の途中の改行はつなげる\n・読み取れない文字は［？］とする\n・説明や前置きは書かず、本文だけを出力する';
  const body = h('div', { class: 'grid md:grid-cols-2 gap-5' },
    h('div', null, prev,
      h('div', { class: 'flex flex-wrap gap-2 mt-3' },
        btn('画像をコピー', { small: true, icon: 'copy', onClick: () => crop && copyImage(crop.toDataURL('image/png')) }),
        btn('AI文字起こし用の指示をコピー', { small: true, icon: 'paste', onClick: () => copyText(ocrPrompt, '指示文をコピーしました。画像と一緒にAIへ貼り付けてください') })),
      h('p', { class: 'text-[11px] text-slate-500 mt-2 leading-relaxed' }, 'OCRはこの端末の中だけで動きます。AIに文字起こしを頼む場合は、画像と指示文をご自身でAIに貼り付けてください（このアプリからは送信しません）。')),
    h('div', { class: 'space-y-3' },
      h('div', { class: 'flex flex-wrap gap-x-4 gap-y-2 items-center text-sm' },
        h('label', { class: 'flex items-center gap-1.5' }, (() => { const c = h('input', { type: 'checkbox', checked: true, class: 'accent-teal-700' }); c.addEventListener('change', () => { opt.dropRuby = c.checked; runLayer(); }); return c; })(), 'ルビ（小さい文字）を除く'),
        h('span', { class: 'flex items-center gap-1.5' }, '改行：', selectEl([['para', '段落ごとに整える'], ['keep', 'PDFの改行のまま'], ['all', 'すべてつなげる']], opt.join, (v) => { opt.join = v; runLayer(); }))),
      ta, status, prog,
      h('div', { class: 'flex flex-wrap items-center gap-2 pt-1' },
        btn('OCRで読み取る', { icon: 'scan', onClick: runOcrNow }),
        selectEl([['h', '横書き'], ['v', '縦書き']], 'h', (v) => { opt.vertical = v === 'v'; }),
        btn('文字データから読み直す', { small: true, kind: 'ghost', onClick: runLayer }))));
  const toStock = () => { const t = ta.value.trim(); if (!t) { toast('テキストが空です', 'warn'); return null; } pushUndo(); const s = { id: uid(), kind: 'text', text: t, src: { name: getDoc(ctx.docId).name, page: ctx.page }, at: Date.now() }; state.stock.push(s); renderStock(); changed(); return s; };
  const m = modal({
    title: `テキスト・史料として抽出（${getDoc(ctx.docId).name} p.${ctx.page}）`, size: 'xl', body,
    footer: [
      btn('テキストをコピー', { icon: 'copy', onClick: () => copyText(ta.value) }),
      h('span', { class: 'flex-1' }),
      btn('ストックに追加', { icon: 'inbox', kind: 'primary', onClick: () => { if (toStock()) { m.close(); toast('テキストをストックに追加しました', 'ok'); setTab('stock'); } } }),
      btn('本文として挿入', { icon: 'text', kind: 'primary', onClick: () => { const s = toStock(); if (!s) return; insertBlocks([newBlock('text', { body: textToRuns(s.text) })]); m.close(); setTab('editor'); } }),
      btn('史料枠で挿入', { icon: 'frame', kind: 'primary', onClick: () => { const s = toStock(); if (!s) return; insertBlocks([newBlock('shiryo', { body: textToRuns(s.text), source: '' })]); m.close(); setTab('editor'); } }),
    ],
  });
  crop = await renderCrop(ctx.docId, ctx.page, r, 150);
  crop.className = 'max-w-full h-auto mx-auto bg-white shadow-sm';
  prev.replaceChildren(crop);
  await runLayer();
}

// ---------- AI問題化プロンプト ----------
const SUBJECTS = ['歴史総合', '日本史探究', '世界史探究', '地理総合', '地理探究', '公共', '倫理', '政治・経済'];
const LEVELS = ['基礎（教科書の基本事項）', '標準（定期考査）', '共通テストレベル', '国公立二次・難関私大レベル'];
const QTYPES = [
  ['blank', '空欄補充（語句記述）'],
  ['tf', '正誤判定（4択）'],
  ['shiryo', '史料読解'],
  ['figure', '図・地図・統計の読み取り'],
  ['order', '年代整序（並べ替え）'],
  ['essay', '論述'],
];

async function openPromptFromRect(r) {
  const ctx = { docId: state.docId, page: state.page };
  const busy = showBusy('素材を準備しています…');
  const mats = [];
  try {
    const t = await extractTextLayer(ctx.docId, ctx.page, r, { dropRuby: true, join: 'para' });
    const src = { name: getDoc(ctx.docId).name, page: ctx.page };
    if (t.text.trim()) mats.push({ kind: 'text', text: t.text, src, use: true });
    const c = processCanvas(await renderCrop(ctx.docId, ctx.page, r, 200), { mode: 'color', brightness: 0, contrast: 0, trim: true });
    mats.push({ kind: 'image', dataUrl: c.toDataURL('image/png'), w: c.width, h: c.height, fmt: 'png', mmW: c._mmW || 0, src, use: !t.text.trim() || t.text.trim().length < 40 });
  } finally { busy.hide(); }
  openPromptModal(mats);
}

function openPromptModalFromStock(items) {
  const mats = items.map((s) => s.kind === 'text'
    ? { kind: 'text', text: s.text, src: s.src, use: true }
    : { kind: 'image', dataUrl: s.dataUrl, w: s.w, h: s.h, fmt: s.fmt, mmW: s.mmW, src: s.src, use: true });
  openPromptModal(mats);
}

function buildPrompt(cfg, mats) {
  const S = state.settings;
  const L = [];
  L.push('あなたは日本の高等学校で地理歴史科・公民科を長く担当してきた、作問経験の豊富な教員です。');
  L.push(`以下の【素材】をもとに、高校「${cfg.subject}」の定期考査問題を作成してください。`);
  L.push('');
  L.push('【作成条件】');
  L.push(`・対象：${cfg.grade || '高校生'}　／　難易度：${cfg.level}`);
  const types = QTYPES.filter(([k]) => Number(cfg.types[k]) > 0);
  if (types.length) {
    L.push('・作成する問題：');
    for (const [k, label] of types) L.push(`　　${label}　${cfg.types[k]}問` + (k === 'essay' ? `（${cfg.essayChars}字程度）` : ''));
  }
  L.push('・素材の記述と、高等学校の標準的な教科書の内容に沿うこと。史実・年代・人名・地名・統計値の正確さを最優先し、確信が持てない内容は使わないこと。');
  L.push('・素材にない事項を問う場合も、高校の教科書で扱う範囲にとどめること。');
  if (cfg.types.tf > 0) L.push('・正誤判定の誤文は、どこが誤りかを解説で具体的に示すこと。細かすぎる数字の違いだけで判定させる問題は避けること。');
  if (cfg.types.shiryo > 0 || cfg.types.figure > 0) L.push('・史料読解・資料読解の問題は、素材を読み取らないと解けない設問にすること。');
  if (cfg.types.order > 0) L.push('・年代整序は3〜4つの出来事を古い順に並べる形式とし、選択肢で答えさせること。');
  if (cfg.types.essay > 0) L.push('・論述問題には、解答例と採点の観点（入れるべき語句・観点）を解説に書くこと。');
  L.push('・各問に配点を付けること。');
  if (cfg.extra && cfg.extra.trim()) L.push('・追加の指示：' + cfg.extra.trim().replace(/\n/g, '\n　'));
  L.push('');
  L.push('【素材】');
  let ti = 0, ii = 0;
  for (const m of mats) {
    if (!m.use) continue;
    const src = m.src && m.src.name ? `（出典：${m.src.name} p.${m.src.page}）` : '';
    if (m.kind === 'text') {
      ti++;
      L.push(`〈素材${ti}：テキスト${src}〉`);
      L.push('"""');
      L.push(m.text.trim());
      L.push('"""');
    } else {
      ii++;
      L.push(`〈図版${ii}：画像${src}〉`);
      L.push(`このメッセージに添付した画像${ii > 1 || mats.filter((x) => x.kind === 'image' && x.use).length > 1 ? `（${ii}枚目）` : ''}が「図版${ii}」です。内容を読み取って問題に使ってください。`);
    }
  }
  if (!ti && !ii) L.push('（素材が選ばれていません）');
  L.push('');
  L.push('【出力形式】');
  if (cfg.out === 'json') {
    const b1 = blankText(S.blankStyle, seq(S.blankStyle, 1), 1), b2 = blankText(S.blankStyle, seq(S.blankStyle, 2), 1);
    const u1 = ulText(S.ulStyle, ulCore(S.ulStyle, 1)), u2 = ulText(S.ulStyle, ulCore(S.ulStyle, 2));
    L.push('次のJSON形式で、```json で始まるコードブロックを1つだけ出力してください（前後の説明文は不要です）。');
    L.push('```json');
    L.push(JSON.stringify({
      daimon: [{
        title: '次の文章を読み、後の問いに答えよ。',
        items: [
          { type: 'text', text: 'リード文。空欄にする語句は{{正解の語句}}、下線を引く語句は[[下線を引く語句]]と書く。' },
          { type: 'shiryo', text: '史料の本文', source: '史料の出典' },
          { type: 'figure', ref: 1, caption: '図の題名' },
          { type: 'question', text: '問題文', choices: ['選択肢の文', '選択肢の文', '選択肢の文', '選択肢の文'], answer: '②', explanation: '解説', points: 2, answerType: 'symbol' },
          { type: 'question', text: '論述の問題文', choices: [], answer: '解答例', explanation: '採点の観点', points: 6, answerType: 'essay', essayChars: 100 },
        ],
      }],
    }, null, 2));
    L.push('```');
    L.push('書き方のルール：');
    L.push(`・空欄は本文中に {{正解の語句}} と書いてください。出現順に自動で「${b1}${b2}…」と記号が振られるので、問題文では「空欄${seq(S.blankStyle, 1)}」のように出現順の記号で参照してください。`);
    L.push(`・下線部は [[語句]] と書いてください。出現順に自動で「${u1}${u2}…」と振られるので、問題文では「下線部${u1}」のように参照してください。`);
    if (S.resetMarks) L.push('・空欄・下線部の記号は大問ごとに最初から振り直されます。');
    L.push('・choices は選択肢の文だけを入れ、①などの番号は付けないでください。選択式でない問題は [] にしてください。');
    L.push('・answer は、選択式なら選択肢の番号（①②③④）、語句記述なら語句、論述なら解答例を書いてください。');
    L.push('・answerType は "symbol"（記号選択）、"word"（語句記述）、"essay"（論述）のいずれかです。論述には "essayChars"（字数）も付けてください。');
    if (ii) L.push('・図版を問題に使うときは {"type":"figure","ref":図版番号} を、その図を見せたい位置に入れてください。');
    L.push('・points は配点（整数）です。');
  } else {
    L.push('問題用紙にそのまま使える形で出力してください。');
    L.push('大問は「第１問」、小問は「問１」「問２」…、選択肢は①〜④とし、最後に「解答・解説」をまとめて付けてください。');
    L.push('見出しの行頭に「・」や「-」などの記号は付けないでください。');
  }
  return L.join('\n');
}

  const out = h('textarea', { class: 'input w-full font-mono-ja text-xs leading-relaxed', rows: 16 });
  const regen = () => { out.value = buildPrompt(cfg, mats); };
  const matList = h('div', { class: 'space-y-2' });
  const renderMats = () => {
    matList.textContent = '';
    if (!mats.length) matList.appendChild(h('p', { class: 'text-sm text-slate-500' }, '素材がありません。'));

      } else {

  extra.addEventListener('input', () => { cfg.extra = extra.value; regen(); });
  const essay = h('input', { type: 'number', min: 20, max: 800, step: 10, value: cfg.essayChars, class: 'input input-sm w-20 text-right' });
  essay.addEventListener('input', () => { cfg.essayChars = Number(essay.value) || 100; regen(); });
  const body = h('div', { class: 'grid lg:grid-cols-2 gap-5' },
    h('div', { class: 'space-y-4' },

// ---------- AIの出力を取り込む ----------
function parseAiOutput(raw) {
  let s = String(raw || '').trim();
  const fence = s.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
  if (fence) s = fence[1];
  const a = s.search(/[[{]/);
  if (a < 0) throw new Error('JSONが見つかりません');
  const close = s[a] === '{' ? '}' : ']';
  const b = s.lastIndexOf(close);
  s = s.slice(a, b + 1);
  s = s.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, '$1');
  return JSON.parse(s);
}
function stripChoiceLabel(c) {
  return String(c == null ? '' : c).replace(/^\s*(?:[①-⑳]|[ア-ン][.．、:：\s]|[A-Da-dＡ-Ｄａ-ｄ][.．)）:：]|[(（]?[0-9０-９]{1,2}[.．)）:：])\s*/, '');
}
function aiToBlocks(obj) {
  let ds;
  if (Array.isArray(obj)) ds = [{ title: '', items: obj }];
  else if (obj && Array.isArray(obj.daimon)) ds = obj.daimon;
  else if (obj && obj.daimon && typeof obj.daimon === 'object') ds = [obj.daimon];
  else if (obj && Array.isArray(obj.items)) ds = [obj];
  else throw new Error('"daimon" または "items" が見つかりません');
  const blocks = [];
  let nq = 0;
  for (const d of ds) {
    blocks.push(newBlock('daimon', { title: d.title || '', points: d.points != null ? d.points : '' }));
    for (const it of d.items || []) {
      const type = it.type || (it.choices ? 'question' : 'text');
      if (type === 'text' || type === 'lead') blocks.push(newBlock('text', { body: markupToRuns(it.text) }));
      else if (type === 'shiryo' || type === 'source' || type === '史料') blocks.push(newBlock('shiryo', { label: it.label || '', body: markupToRuns(it.text), source: it.source || '' }));
      else if (type === 'figure' || type === 'image') {
        const img = state.promptImages[(Number(it.ref) || 1) - 1];
        if (img) blocks.push(newBlock('image', { dataUrl: img.dataUrl, w: img.w, h: img.h, fmt: img.fmt || 'png', widthPct: defaultWidthPct(img.mmW), caption: it.caption || '', origin: img.src ? `${img.src.name} p.${img.src.page}` : '' }));
        else blocks.push(newBlock('text', { body: textToRuns(`［ここに図版${it.ref || ''}を入れる：${it.caption || ''}］`) }));
      } else if (type === 'question') {
        nq++;
        const choices = (it.choices || []).map((c) => markupToRuns(stripChoiceLabel(c)));
        const at = ['symbol', 'word', 'essay'].includes(it.answerType) ? it.answerType : (choices.length ? 'symbol' : 'word');
        const maxLen = Math.max(0, ...(it.choices || []).map((c) => String(c).length));
        blocks.push(newBlock('question', {
          body: markupToRuns(it.text),
          choices,
          choiceLayout: choices.length && maxLen <= 10 ? 'h4' : choices.length && maxLen <= 22 ? 'h2' : 'v',
          answer: String(it.answer == null ? '' : it.answer),
          explanation: String(it.explanation || ''),
          points: it.points != null && !isNaN(Number(it.points)) ? Number(it.points) : 2,
          answerType: at,
          essayChars: Number(it.essayChars) || 100,
        }));
      }
    }
  }
  return { blocks, nd: ds.length, nq };
}

// ===== 05b 図版の編集（記号・白ぬり・矢印・囲みなど） =====
const FIG_GOTHIC = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans CJK JP","Meiryo",sans-serif';
const FIG_MINCHO = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","MS Mincho",serif';
const FIG_SEQS = [['upper', 'A B C …'], ['kana', 'ア イ ウ …'], ['circled', '① ② ③ …'], ['lower', 'a b c …'], ['num', '1 2 3 …'], ['roman', 'Ⅰ Ⅱ Ⅲ …'], ['free', '自由に入力']];
const figSeqVal = (kind, n) => seq({ upper: 'alpha', kana: 'kana', circled: 'circled', lower: 'lower', num: 'num', roman: 'roman' }[kind] || 'alpha', n);
const FIG_TOOLS = [
  ['select', '選択・移動', 'pointer'],
  ['label', '記号・文字', 'text'],
  ['hide', '白でかくす', 'eraser'],
  ['arrow', '矢印', 'arrowR'],
  ['line', '線', 'line'],
  ['rect', '四角で囲む', 'square'],
  ['ellipse', '丸で囲む', 'circle'],
  ['dot', '点', 'dot'],
];

function figTextBox(ctx, it) {
  ctx.font = `${it.bold ? 'bold ' : ''}${it.size}px ${it.font === 'mincho' ? FIG_MINCHO : FIG_GOTHIC}`;
  const tw = Math.max(ctx.measureText(it.text || ' ').width, it.size * 0.6);
  const pad = it.size * 0.28;
  if (it.frame === 'circle') { const r = Math.max(tw, it.size) / 2 + pad; return { w: r * 2, h: r * 2, r, tw }; }
  return { w: tw + pad * 2, h: it.size + pad * 2, tw };
}

function figDrawItem(ctx, it) {
  ctx.save();
  const dash = it.dash ? [it.width * 3, it.width * 2] : [];
  switch (it.t) {
    case 'hide':
      ctx.fillStyle = it.color;
      ctx.fillRect(it.x, it.y, it.w, it.h);
      break;
    case 'rect':
      ctx.strokeStyle = it.color; ctx.lineWidth = it.width; ctx.setLineDash(dash);
      ctx.strokeRect(it.x, it.y, it.w, it.h);
      break;
    case 'ellipse':
      ctx.strokeStyle = it.color; ctx.lineWidth = it.width; ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.ellipse(it.x + it.w / 2, it.y + it.h / 2, Math.abs(it.w / 2), Math.abs(it.h / 2), 0, 0, Math.PI * 2);
      ctx.stroke();
      break;
    case 'dot':
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
      break;
    case 'line':
    case 'arrow': {
      ctx.strokeStyle = it.color; ctx.fillStyle = it.color; ctx.lineWidth = it.width; ctx.lineCap = 'round';
      const ang = Math.atan2(it.y2 - it.y1, it.x2 - it.x1);
      const hl = Math.max(10, it.width * 4.5);
      const heads = it.t === 'arrow' ? (it.head || 'end') : 'none';
      // 矢じりの分だけ線を短くする
      let x1 = it.x1, y1 = it.y1, x2 = it.x2, y2 = it.y2;
      if (heads === 'end' || heads === 'both') { x2 -= Math.cos(ang) * hl * 0.7; y2 -= Math.sin(ang) * hl * 0.7; }
      if (heads === 'both') { x1 += Math.cos(ang) * hl * 0.7; y1 += Math.sin(ang) * hl * 0.7; }
      ctx.setLineDash(dash);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.setLineDash([]);
      const head = (x, y, a) => {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - hl * Math.cos(a - 0.42), y - hl * Math.sin(a - 0.42));
        ctx.lineTo(x - hl * Math.cos(a + 0.42), y - hl * Math.sin(a + 0.42));
        ctx.closePath(); ctx.fill();
      };
      if (heads === 'end' || heads === 'both') head(it.x2, it.y2, ang);
      if (heads === 'both') head(it.x1, it.y1, ang + Math.PI);
      break;
    }
    case 'text': {
      const b = figTextBox(ctx, it);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lw = Math.max(1.5, it.size * 0.08);
      if (it.bg === 'box') {
        ctx.fillStyle = '#ffffff';
        if (it.frame === 'circle') { ctx.beginPath(); ctx.arc(it.x, it.y, b.r, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(it.x - b.w / 2, it.y - b.h / 2, b.w, b.h);
      }
      if (it.frame === 'circle') { ctx.strokeStyle = it.color; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(it.x, it.y, b.r - lw / 2, 0, Math.PI * 2); ctx.stroke(); }
      else if (it.frame === 'box') { ctx.strokeStyle = it.color; ctx.lineWidth = lw; ctx.strokeRect(it.x - b.w / 2 + lw / 2, it.y - b.h / 2 + lw / 2, b.w - lw, b.h - lw); }
      const ty = it.y + it.size * 0.04;
      if (it.bg === 'halo') {
        ctx.strokeStyle = it.color.toLowerCase() === '#ffffff' ? '#000000' : '#ffffff';
        ctx.lineWidth = Math.max(3, it.size * 0.22);
        ctx.lineJoin = 'round';
        ctx.strokeText(it.text, it.x, ty);
      }
      ctx.fillStyle = it.color;
      ctx.fillText(it.text, it.x, ty);
      break;
    }
    default: break;
  }
  ctx.restore();
}

function figBBox(ctx, it) {
  switch (it.t) {
    case 'text': { const b = figTextBox(ctx, it); return { x: it.x - b.w / 2, y: it.y - b.h / 2, w: b.w, h: b.h }; }
    case 'dot': return { x: it.x - it.r, y: it.y - it.r, w: it.r * 2, h: it.r * 2 };
    case 'line': case 'arrow': {
      const p = it.width + 6;

// ---------- 文章欄（空欄・下線部を含められる） ----------
function chipFor(m) {
  if (m.t === 'b') {
    return h('span', { class: 'chip-b', contenteditable: 'false', 'data-k': 'b', 'data-id': m.id, title: 'クリックで正解・記号を編集' },
      h('span', { class: 'chip-lbl' }, '?'), h('span', { class: 'chip-ans' }, m.ans));
  }
  return h('span', { class: 'chip-u', contenteditable: 'false', 'data-k': 'u', 'data-id': m.id, title: 'クリックで下線部を編集' },
    h('sup', { class: 'chip-lbl' }, '?'), h('span', { class: 'chip-utext' }, m.v));
}

function appendTextWithBreaks(el, text) {
  const parts = text.split('\n');
  parts.forEach((p, i) => {
    if (i > 0) el.appendChild(document.createElement('br'));
    if (p) el.appendChild(document.createTextNode(p));
  });
}

function domToRuns(root, marks) {
  const runs = [];
  const push = (s) => {
    if (!s) return;
    const l = runs[runs.length - 1];
    if (l && l.t === 's') l.v += s; else runs.push({ t: 's', v: s });
  };
  const endsNL = () => { const l = runs[runs.length - 1]; return !l || (l.t === 's' && l.v.endsWith('\n')); };
  const walk = (nodes) => {
    for (const n of nodes) {
      if (n.nodeType === 3) push(n.nodeValue.replace(/​/g, '').replace(/ /g, ' '));
      else if (n.nodeType === 1) {
        const k = n.getAttribute('data-k');
        if (k === 'b' || k === 'u') { const m = marks.get(n.getAttribute('data-id')); if (m) runs.push(m); }
        else if (n.nodeName === 'BR') push('\n');
        else if (n.nodeName === 'DIV' || n.nodeName === 'P') {
          if (runs.length && !endsNL()) push('\n');
          let ch = Array.from(n.childNodes);
          if (ch.length === 1 && ch[0].nodeName === 'BR') ch = [];
          walk(ch);
          if (n.nextSibling && !endsNL()) push('\n');
        } else walk(Array.from(n.childNodes));
      }
    }
  };
  let nodes = Array.from(root.childNodes);
  if (nodes.length && nodes[nodes.length - 1].nodeName === 'BR') nodes = nodes.slice(0, -1);
  walk(nodes);
  return runs;
}

function richField(runs, setRuns, opts = {}) {
  const el = h('div', { class: 'rich ' + (opts.cls || ''), contenteditable: 'true', 'data-rich': '1', spellcheck: 'false', 'data-ph': opts.placeholder || '' });
  const marks = new Map();
  for (const r of runs || []) {
    if (r.t === 's') appendTextWithBreaks(el, r.v);
    else { marks.set(r.id, r); el.appendChild(chipFor(r)); }
  }
  const last = (runs || [])[runs ? runs.length - 1 : 0];
  if (last && last.t === 's' && last.v.endsWith('\n')) el.appendChild(document.createElement('br'));
  const sync = () => {
    const before = marks.size;
    const nr = domToRuns(el, marks);
    // DOMから消えたマークを除外
    const alive = new Set(nr.filter((r) => r.t !== 's').map((r) => r.id));
    for (const id of [...marks.keys()]) if (!alive.has(id)) marks.delete(id);
    setRuns(nr);
    el.classList.toggle('is-empty', !el.textContent.trim() && !marks.size);
    if (marks.size !== before) { refreshLabels(); renderAnswersIfVisible(); }
    changed();
  };
  el.classList.toggle('is-empty', !el.textContent.trim() && !marks.size);
  el.addEventListener('input', (e) => { if (!e.isComposing) sync(); });
  el.addEventListener('compositionend', sync);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      if (!document.execCommand('insertLineBreak')) {
        const sel = getSelection();
        if (sel.rangeCount) { const r = sel.getRangeAt(0); r.deleteContents(); const br = document.createElement('br'); r.insertNode(br); r.setStartAfter(br); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); }
      }
      sync();
    }
    if ((e.ctrlKey || e.metaKey) && ['b', 'i', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\r\n?/g, '\n');
    const lines = t.split('\n');
    lines.forEach((ln, i) => {
      if (i > 0) document.execCommand('insertLineBreak');
      if (ln) document.execCommand('insertText', false, ln);
    });
    sync();
  });
  el.addEventListener('drop', (e) => e.preventDefault());
  el.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-k]');
    if (chip) openMarkEditor(chip.getAttribute('data-id'), el);
  });
  el._sync = sync;
  el._marks = marks;
  return el;
}

// 選択中の語句を空欄・下線部に
let _lastRange = null;
document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  const node = r.commonAncestorContainer;
  const f = (node.nodeType === 1 ? node : node.parentElement)?.closest('[data-rich]');
  if (f) _lastRange = { range: r.cloneRange(), field: f };
});

function markSelection(kind) {
  const sel = getSelection();
  let range = null, fieldEl = null;
  if (sel.rangeCount && !sel.isCollapsed) {
    range = sel.getRangeAt(0);
    const node = range.commonAncestorContainer;
    fieldEl = (node.nodeType === 1 ? node : node.parentElement)?.closest('[data-rich]');
  }
  if (!fieldEl && _lastRange && document.body.contains(_lastRange.field)) { range = _lastRange.range; fieldEl = _lastRange.field; }
  if (!fieldEl || !range || range.collapsed) { toast('問題エディタの文章の中で、語句をドラッグして選んでから押してください', 'warn', 4500); return; }
  const frag = range.cloneContents();
  if (frag.querySelector && frag.querySelector('[data-k]')) { toast('すでに空欄・下線部になっている部分を含む範囲は選べません', 'warn'); return; }
  let text = range.toString().replace(/\n/g, '');
  if (!text.trim()) return;
  pushUndo();
  const S = state.settings;
  const m = kind === 'b' ? { t: 'b', id: uid(), ans: text.trim(), style: S.blankStyle } : { t: 'u', id: uid(), v: text, style: S.ulStyle };
  fieldEl._marks.set(m.id, m);
  range.deleteContents();
  const chip = chipFor(m);
  range.insertNode(chip);
  const after = document.createRange();
  after.setStartAfter(chip);
  after.collapse(true);
  sel.removeAllRanges();
  sel.addRange(after);
  _lastRange = null;
  fieldEl._sync();
  refreshLabels();
  renderAnswersIfVisible();
  toast(kind === 'b' ? `「${m.ans}」を空欄にしました（解答一覧に追加）` : `「${m.v}」を下線部にしました`, 'ok');
}

function findMark(id) {
  for (const b of state.blocks) for (const runs of blockRunFields(b)) for (const r of runs) if (r.id === id) return r;
  return null;
}

function unmark(id) {
  const chip = $(`#panel-editor [data-id="${id}"]`);
  const m = findMark(id);
  if (!chip || !m) return;
  pushUndo();
  const fieldEl = chip.closest('[data-rich]');
  chip.replaceWith(document.createTextNode(m.t === 'b' ? m.ans : m.v));
  fieldEl._sync();
  refreshLabels();
  renderAnswersIfVisible();
}

function openMarkEditor(id) {
  const m = findMark(id);
  if (!m) return;
  const num = computeNumbering();
  const info = num.marks.get(id);
  if (m.t === 'b') {
    const ans = h('input', { class: 'input w-full', value: m.ans });
    const md = modal({
      title: `空欄 ${info ? info.core : ''} の設定`, size: 'sm',
      body: h('div', { class: 'space-y-3' },
        field('正解（解答一覧に入ります）', ans),
        field('記号の種類', selectEl(BLANK_STYLES, m.style, (v) => { m.style = v; refreshLabels(); renderAnswersIfVisible(); changed(); }, 'input w-full'))),
      footer: [
        btn('空欄を解除（元の語句に戻す）', { kind: 'ghost', icon: 'undo', onClick: () => { md.close(); unmark(id); } }),
        h('span', { class: 'flex-1' }),
        btn('閉じる', { kind: 'primary', onClick: () => md.close() }),
      ],
      onClose: () => { m.ans = ans.value; refreshLabels(); renderAnswersIfVisible(); changed(); },
    });
  } else {
    const tx = h('input', { class: 'input w-full', value: m.v });
    const md = modal({
      title: `下線部 ${info ? info.text : ''} の設定`, size: 'sm',
      body: h('div', { class: 'space-y-3' },
        field('下線を引く語句', tx),
        field('記号の種類', selectEl(UL_STYLES, m.style, (v) => { m.style = v; refreshLabels(); changed(); }, 'input w-full'))),
      footer: [
        btn('下線を解除', { kind: 'ghost', icon: 'undo', onClick: () => { md.close(); unmark(id); } }),
        h('span', { class: 'flex-1' }),
        btn('閉じる', { kind: 'primary', onClick: () => md.close() }),
      ],
      onClose: () => { if (tx.value.trim()) m.v = tx.value; refreshLabels(); changed(); },
    });
  }
}

// 番号の表示を更新（文章欄を作り直さない）
function refreshLabels() {
  const num = computeNumbering();
  for (const chip of $$('#panel-editor [data-k]')) {
    const info = num.marks.get(chip.getAttribute('data-id'));
    const m = info && info.mark;
    if (!m) continue;
    const lbl = chip.querySelector('.chip-lbl');
    if (chip.getAttribute('data-k') === 'b') {
      lbl.textContent = info.core;
      chip.querySelector('.chip-ans').textContent = m.ans;
    } else {
      lbl.textContent = info.text;
      chip.querySelector('.chip-utext').textContent = m.v;
    }
  }
  for (const el of $$('#panel-editor [data-blabel]')) {
    const info = num.blocks.get(el.getAttribute('data-blabel'));
    if (info) el.textContent = info.label;
  }
  for (const el of $$('#panel-editor [data-bph]')) {
    const info = num.blocks.get(el.getAttribute('data-bph'));
    if (info && info.auto) el.setAttribute('placeholder', info.auto);
  }
  for (const g of num.groups) {
    if (!g.daimon) continue;
    const el = $(`#panel-editor [data-sum="${g.daimon.id}"]`);
    if (el) el.textContent = `小問の合計 ${g.points}点`;
  }
  const t = $('#editor-total');
  if (t) t.textContent = `合計 ${num.total}点`;
}

// ---------- ブロック操作 ----------
function insertBlocks(blocks, afterId = state.activeBlock) {
  pushUndo();
  let idx = state.blocks.findIndex((b) => b.id === afterId);
  idx = idx < 0 ? state.blocks.length : idx + 1;
  state.blocks.splice(idx, 0, ...blocks);
  state.activeBlock = blocks[blocks.length - 1].id;
  renderEditor();
  changed();
  setTimeout(() => {
    const el = $(`#panel-editor [data-block="${blocks[0].id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 30);
}
function moveBlock(id, delta) {
  const i = state.blocks.findIndex((b) => b.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= state.blocks.length) return;
  pushUndo();
  const [b] = state.blocks.splice(i, 1);
  state.blocks.splice(j, 0, b);
  renderEditor();
  changed();
}
function moveBlockTo(id, toIndex) {
  const i = state.blocks.findIndex((b) => b.id === id);
  if (i < 0) return;
  pushUndo();
  const [b] = state.blocks.splice(i, 1);
  if (toIndex > i) toIndex--;
  state.blocks.splice(toIndex, 0, b);
  renderEditor();
  changed();
}
function cloneBlock(b) {
  const c = deepCopy(b);
  c.id = uid();
  for (const runs of blockRunFields(c)) for (const r of runs) if (r.t !== 's') r.id = uid();
  return c;
}
async function deleteBlock(id) {
  pushUndo();
  state.blocks = state.blocks.filter((b) => b.id !== id);
  if (state.activeBlock === id) state.activeBlock = null;
  renderEditor();
  renderAnswersIfVisible();
  changed();
  toast('削除しました（「元に戻す」で復元できます）');
}
function setActive(id) {
  if (state.activeBlock === id) return;
  state.activeBlock = id;
  for (const c of $$('#panel-editor [data-block]')) c.classList.toggle('card-active', c.dataset.block === id);
}

  }
  const num = computeNumbering();

// ---------- ドラッグで並べ替え（マウス・タッチ両対応） ----------
function initDrag(grip, card, b) {
  grip.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const listEl = $('#block-list');
    const cards = $$('[data-block]', listEl);
    const startIdx = cards.indexOf(card);
    card.classList.add('dragging');
    const ind = h('div', { class: 'drop-ind' });
    let target = startIdx;
    const onMove = (ev) => {
      const y = ev.clientY;
      let idx = cards.length;
      for (let i = 0; i < cards.length; i++) {
        const r = cards[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) { idx = i; break; }
      }
      target = idx;
      if (idx < cards.length) listEl.insertBefore(ind, cards[idx]); else listEl.appendChild(ind);
      const sc = $('#panel-editor');
      const pr = sc.getBoundingClientRect();
      if (y < pr.top + 60) sc.scrollTop -= 12; else if (y > pr.bottom - 60) sc.scrollTop += 12;
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      card.classList.remove('dragging');
      ind.remove();
      if (target !== startIdx && target !== startIdx + 1) moveBlockTo(b.id, target);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

const MM = 56.6929; // 1mm = 56.69 twips
function mkPaper(name, w, h, land, cols, margin, space = 0) {
  const pageW = land ? h : w;
  const contentW = pageW - margin * 2;
  const colW = cols > 1 ? Math.floor((contentW - space * (cols - 1)) / cols) : contentW;
  return { name, w, h, land, cols, margin, space, contentW, colW, colWmm: colW / MM };
}
